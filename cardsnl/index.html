<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broadcast Cards Editor</title>
<style>
:root{--bg:#0f1720;--pn:#17222e;--ln:#26384a;--tx:#e6edf3;--mu:#8aa0b4;--ac:#4EC1EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ln)}
header h1{font-size:16px;margin:0;flex:1}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;padding:14px}
section{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px}
section h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;background:#0b1219;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;font:inherit}
input[type=color]{padding:2px;height:34px;width:46px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.pair{display:grid;grid-template-columns:1.4fr 1fr;gap:6px;margin-bottom:6px}
button{background:#22344a;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#062033;border-color:var(--ac);font-weight:600}
button.on{background:#1f7a3d;border-color:#2fb15a}
button.off{background:#7a2a1f;border-color:#b1452f}
.url{display:flex;gap:6px;margin-top:4px}
.url input{font:12px ui-monospace,monospace}
.prev{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;border-radius:6px;overflow:hidden;
  background:repeating-conic-gradient(#2a2f36 0 25%,#1d2228 0 50%) 0 0/24px 24px}
.prev iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
.note{color:var(--mu);font-size:12px;margin-top:6px}
.logoPrev{width:46px;height:46px;object-fit:contain;background:#0b1219;border:1px solid var(--ln);border-radius:6px;flex:none}
.wide{grid-column:1/-1}
</style>
</head>
<body>
<header>
  <h1>Broadcast Cards — Editor</h1>
  <button id="reset">Reset to defaults</button>
</header>
<main>
  <section>
    <h2>League / Branding</h2>
    <label>Logo URL (file in repo, e.g. <code>logors.png</code>, or full https URL)</label>
    <div class="row"><img id="logoPrev" class="logoPrev" alt=""><input id="logo"></div>
    <div class="row" style="margin-top:8px"><button id="auto" class="pri">Colors from logo</button><span id="autoMsg" class="note"></span></div>
    <label>Panel color</label><div class="row"><input type="color" id="c1p"><input id="c1"></div>
    <label>Accent color</label><div class="row"><input type="color" id="c2p"><input id="c2"></div>
    <label>Text color</label><div class="row"><input type="color" id="c3p"><input id="c3"></div>
    <label>League title (top-right of header)</label><input id="t">
    <label>Footer line (match / round — empty hides it)</label><input id="s" placeholder="π.χ. ΟΜΑΔΑ Α – ΟΜΑΔΑ Β • 3η Αγωνιστική">
  </section>
  <section id="sec-caster"></section>
  <section id="sec-refs"></section>
</main>

<script>
const KEY = 'bcards-state-v1';
const DEF = {
  brand:{logo:'logors.png',c1:'#0B3A5E',c2:'#4EC1EA',c3:'#FFFFFF',t:'NATIONAL LEAGUE 1',s:''},
  caster:{h:'ΣΧΟΛΙΑΣΜΟΣ',pos:'bl',scale:'1',anim:'1',vis:true,
    p1:'Όνομα Επώνυμο',r1:'Σχολιαστής',p2:'Όνομα Επώνυμο',r2:'Αναλυτής',p3:'',r3:'',p4:'',r4:''},
  refs:{h:'ΔΙΑΙΤΗΣΙΑ',pos:'bc',scale:'1',anim:'1',vis:true,
    p1:'Όνομα Επώνυμο',r1:'Α΄ Διαιτητής',p2:'Όνομα Επώνυμο',r2:'Β΄ Διαιτητής',
    p3:'Όνομα Επώνυμο',r3:'Γ΄ Διαιτητής',p4:'',r4:'Κομισάριος'}
};
const CARDS = {caster:{title:'Caster card',page:'caster.html',rows:4},
               refs:{title:'Referees card',page:'referees.html',rows:4}};
const clone = o => JSON.parse(JSON.stringify(o));
let S;
try { S = Object.assign(clone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = clone(DEF); }
for (const k of ['brand','caster','refs']) S[k] = Object.assign(clone(DEF[k]), S[k] || {});

const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
const $ = id => document.getElementById(id);

/* ---------- build card sections ---------- */
for (const [k, c] of Object.entries(CARDS)) {
  let h = `<h2>${c.title}</h2>
  <label>Header</label><input data-k="${k}" data-f="h">
  <label>Names / roles (empty name = hidden)</label>`;
  for (let i = 1; i <= c.rows; i++)
    h += `<div class="pair"><input data-k="${k}" data-f="p${i}" placeholder="Name ${i}"><input data-k="${k}" data-f="r${i}" placeholder="Role"></div>`;
  h += `<div class="row">
     <div><label>Position</label><select data-k="${k}" data-f="pos">
       <option value="bl">Bottom left</option><option value="bc">Bottom center</option><option value="br">Bottom right</option>
       <option value="tl">Top left</option><option value="tr">Top right</option><option value="c">Center</option></select></div>
     <div><label>Scale</label><input type="number" step="0.05" min="0.3" max="2" data-k="${k}" data-f="scale"></div>
     <div><label>Intro anim</label><select data-k="${k}" data-f="anim"><option value="1">On</option><option value="0">Off</option></select></div>
   </div>
   <label>LIVE URL (use in OBS — follows this editor)</label>
   <div class="url"><input readonly id="${k}-live"><button data-copy="${k}-live">Copy</button></div>
   <label>STATIC URL (text baked into the link)</label>
   <div class="url"><input readonly id="${k}-static"><button data-copy="${k}-static">Copy</button></div>
   <div class="row" style="margin-top:10px"><button id="${k}-vis"></button></div>
   <div class="prev" id="${k}-prev"><iframe id="${k}-frame" tabindex="-1"></iframe></div>`;
  $('sec-' + k).innerHTML = h;
}

/* ---------- bind inputs ---------- */
document.querySelectorAll('[data-k]').forEach(el => {
  el.value = S[el.dataset.k][el.dataset.f] ?? '';
  el.addEventListener('input', () => { S[el.dataset.k][el.dataset.f] = el.value; update(); });
});
['logo','t','s'].forEach(f => { $(f).value = S.brand[f]; $(f).addEventListener('input', () => { S.brand[f] = $(f).value; update(); }); });
['c1','c2','c3'].forEach(f => {
  const t = $(f), p = $(f + 'p');
  const sync = () => { t.value = S.brand[f]; if (/^#[0-9a-f]{6}$/i.test(S.brand[f])) p.value = S.brand[f]; };
  sync();
  p.addEventListener('input', () => { S.brand[f] = p.value.toUpperCase(); sync(); update(); });
  t.addEventListener('input', () => { S.brand[f] = t.value; if (/^#[0-9a-f]{6}$/i.test(t.value)) p.value = t.value; update(); });
  $(f).syncColor = sync;
});
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
  const i = $(b.dataset.copy); i.select(); navigator.clipboard.writeText(i.value).catch(() => document.execCommand('copy'));
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1000);
}));
for (const k of Object.keys(CARDS)) $(k + '-vis').addEventListener('click', () => { S[k].vis = !S[k].vis; update(); });
$('reset').addEventListener('click', () => { if (confirm('Reset all fields?')) { localStorage.removeItem(KEY); location.reload(); } });

/* ---------- URLs + previews ---------- */
function staticUrl(k) {
  const q = new URLSearchParams();
  for (const [f, v] of Object.entries(S.brand)) q.set(f, v);
  for (const [f, v] of Object.entries(S[k])) if (f !== 'vis') q.set(f, v);
  return base + CARDS[k].page + '?' + q.toString();
}
function liveUrl(k) {
  const q = new URLSearchParams({live: '1'});
  return base + CARDS[k].page + '?' + q.toString();
}
let timer;
function update() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  $('logoPrev').src = S.brand.logo || '';
  for (const k of Object.keys(CARDS)) {
    $(k + '-live').value = liveUrl(k);
    $(k + '-static').value = staticUrl(k);
    const b = $(k + '-vis');
    b.textContent = S[k].vis ? 'ON AIR — click to hide' : 'HIDDEN — click to show';
    b.className = S[k].vis ? 'on' : 'off';
  }
  clearTimeout(timer);
  timer = setTimeout(() => { for (const k of Object.keys(CARDS)) $(k + '-frame').src = staticUrl(k); }, 250);
}
function fit() {
  for (const k of Object.keys(CARDS)) { const p = $(k + '-prev'); $(k + '-frame').style.transform = `scale(${p.clientWidth / 1920})`; }
}
addEventListener('resize', fit);

/* ---------- extract colors from logo ---------- */
$('auto').addEventListener('click', () => {
  const msg = $('autoMsg'); msg.textContent = 'Reading logo…';
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const cv = document.createElement('canvas'), N = 96; cv.width = cv.height = N;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, N, N);
      const d = cx.getImageData(0, 0, N, N).data, bins = {};
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 200) continue;
        const key = (d[i] >> 4) + ',' + (d[i + 1] >> 4) + ',' + (d[i + 2] >> 4);
        const b = bins[key] || (bins[key] = {n: 0, r: 0, g: 0, b: 0});
        b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2];
      }
      const cols = Object.values(bins).map(b => {
        const r = b.r / b.n, g = b.g / b.n, bl = b.b / b.n, mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
        return {n: b.n, r, g, b: bl, lum: (0.2126 * r + 0.7152 * g + 0.0722 * bl) / 255, sat: mx ? (mx - mn) / mx : 0};
      }).sort((a, b) => b.n - a.n);
      const toHex = c => '#' + [c.r, c.g, c.b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
      const dark = cols.find(c => c.lum < 0.35 && c.sat > 0.2);
      const light = cols.find(c => c.lum > 0.4 && c.sat > 0.3);
      if (!dark && !light) throw 0;
      if (dark) S.brand.c1 = toHex(dark);
      if (light) S.brand.c2 = toHex(light);
      S.brand.c3 = '#FFFFFF';
      ['c1','c2','c3'].forEach(f => $(f).syncColor());
      update(); msg.textContent = 'Done.';
    } catch (e) { msg.textContent = 'Could not read colors (external URL blocks it — put the logo in the repo).'; }
  };
  img.onerror = () => msg.textContent = 'Logo not found.';
  img.src = S.brand.logo;
});

update(); fit(); setTimeout(fit, 50);
</script>
</body>
</html>

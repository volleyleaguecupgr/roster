<!doctype html>
<html lang="el"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVL Posts</title>
<link rel="stylesheet" href="css/cev.css">
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/teams-el.js"></script>
<script src="js/vendor/html-to-image.js"></script>
<style>
  /* Social posts: schedule / results / standings in 1080×1350, 1080×1080, 1080×1920, 1920×1080. Greek labels + js/teams-el.js names.
     URL: posts.html?type=results&fmt=post&which=prev&league=hvl&team=paok&footer=#volleyleague */
  html, body { overflow: auto; background: #10141d; }
  body { font-family: var(--font, 'Saira', sans-serif); color: #fff; }
  .ui { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 14px 18px; background: #0b0f17; border-bottom: 1px solid #2a3346; }
  .ui label { display: flex; flex-direction: column; gap: 4px; font: 600 12px system-ui, sans-serif; color: #9aa6bd; text-transform: uppercase; }
  .ui select, .ui input, .ui button { font: 15px system-ui, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a3346; background: #151b27; color: #fff; }
  .ui button { background: #99f5fd; color: #242c3b; font-weight: 800; border: 0; cursor: pointer; }
  .ui button.ghost { background: transparent; color: #99f5fd; border: 1px solid #99f5fd; }
  .ui .msg { font: 13px system-ui, sans-serif; color: #9aa6bd; align-self: center; }
  .wrap { padding: 24px; display: flex; justify-content: center; }
  .scaler { transform-origin: 0 0; }

  /* ---------- the post ---------- */
  #post { position: relative; overflow: hidden; background: #0c1323 url('img/bg-novi.jpg') center / cover no-repeat; color: #fff;
          font-family: var(--font, 'Saira', sans-serif); --aqua: #99f5fd; --ink: #242c3b; --slate: #242c3b; --slate2: #2f394b; --cut: 18px; }
  #post * { box-sizing: border-box; }
  .par { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  .hdr { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
  .hdr .lg { height: var(--logoH); margin-top: var(--padT); }
  .hdr .lg img { height: 100%; width: auto; object-fit: contain; }
  .hdr .tt { margin-top: 18px; padding: 0 70px; height: var(--ttH); display: grid; place-items: center; background: linear-gradient(100deg, #99f5fd, #c4fbff);
             color: var(--ink); font-weight: 900; font-style: italic; font-size: calc(var(--ttH) * .62); letter-spacing: 1px; text-transform: uppercase; --cut: 24px; }
  .hdr .st { margin-top: 12px; height: calc(var(--ttH) * .5); padding: 0 50px; display: grid; place-items: center; background: var(--slate2); border-bottom: 3px solid var(--aqua);
             font-weight: 800; font-size: calc(var(--ttH) * .27); letter-spacing: 1.5px; text-transform: uppercase; }
  .list { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--gap); }
  .row { height: var(--rh); display: grid; align-items: center; background: linear-gradient(100deg, rgba(36,44,59,.96), rgba(29,36,49,.96));
         box-shadow: inset 0 -3px 0 var(--aqua); font-weight: 800; }
  .row.hl { background: linear-gradient(100deg, rgba(153,245,253,.28), rgba(36,44,59,.96) 55%); }
  .g { grid-template-columns: var(--dateW) var(--logoW) minmax(0, 1fr) var(--midW) minmax(0, 1fr) var(--logoW); }
  .g.nd { grid-template-columns: var(--logoW) minmax(0, 1fr) var(--midW) minmax(0, 1fr) var(--logoW); }
  /* narrow formats: stacked match blocks (home line / away line), every name on one line, same size */
  .mb { height: calc(var(--rh) * 1.3); display: grid; grid-template-columns: minmax(0, 1fr) var(--scW); background: linear-gradient(100deg, rgba(36,44,59,.96), rgba(29,36,49,.96)); box-shadow: inset 0 -3px 0 var(--aqua); }
  .mb.hl { background: linear-gradient(100deg, rgba(153,245,253,.28), rgba(36,44,59,.96) 55%); }
  .mb .lns { display: grid; grid-template-rows: 1fr 1fr; padding: 6px 0 6px calc(var(--cut) + 6px); min-width: 0; }
  .mb .ln { display: grid; grid-template-columns: calc(var(--rh) * .62) minmax(0, 1fr); align-items: center; gap: 16px; min-width: 0; }
  .mb .ln .lo { width: calc(var(--rh) * .5); height: calc(var(--rh) * .5); font-size: calc(var(--rh) * .14); justify-self: start; }
  .mb .ln .tn { padding: 0; text-align: left; font-size: calc(var(--rh) * .33); font-weight: 800; }
  .mb .sc { display: grid; grid-template-rows: 1fr 1fr; }
  .mb .sc b { display: grid; place-items: center; font-weight: 900; font-size: calc(var(--rh) * .4); background: var(--slate2); }
  .mb .sc b.w { background: var(--aqua); color: var(--ink); }
  .mb .sc.vs, .mb .sc.live { display: grid; place-items: center; align-content: center; background: var(--slate2); font-weight: 900; font-size: calc(var(--rh) * .34); }
  .mb .sc.live { background: #ff5a6b; } .mb .sc.live small { font-size: calc(var(--rh) * .14); letter-spacing: 1px; }
  /* schedule: TV logo column + court name */
  .mb.wtv { grid-template-columns: minmax(0, 1fr) var(--tvW) var(--scW); }
  .g.wtv { grid-template-columns: var(--dateW) var(--logoW) minmax(0, 1fr) var(--midW) minmax(0, 1fr) var(--logoW) var(--tvW); }
  .tv { height: 100%; display: grid; place-items: center; padding: 0 10px; }
  .tv img { max-width: 100%; max-height: 92%; object-fit: contain; }
  .mb .sc.vs small, .row .mid.vs small { display: block; margin-top: 4px; font-size: calc(var(--rh) * .15); font-weight: 800; letter-spacing: .5px; color: var(--aqua); opacity: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 6px; }
  /* narrow formats, "rows" layout: home name | home logo | time+court+TV | away logo | away name (names may wrap to 2 lines, all the same size) */
  .n2 { grid-template-columns: minmax(0, 1fr) var(--logoW) var(--scW) var(--logoW) minmax(0, 1fr); height: var(--rh); }
  .n2 .nmw { height: 100%; min-width: 0; display: flex; align-items: center; padding: 0 14px; overflow: hidden; }
  .n2 .nmw.h { justify-content: flex-end; padding-left: calc(var(--cut) + 10px); } .n2 .nmw.a { padding-right: calc(var(--cut) + 10px); }
  .n2 .nmw span { display: block; width: 100%; font-weight: 800; line-height: 1.04; text-transform: uppercase; font-size: calc(var(--rh) * .3); overflow-wrap: normal; }
  .n2 .nmw.h span { text-align: right; } .n2 .nmw.l span { color: rgba(255,255,255,.55); }
  .row .lo, .n2 .lo { width: calc(var(--rh) * .84); height: calc(var(--rh) * .84); }
  .n2 .mid { padding: 4px 6px; }
  .mid .tvl { display: block; height: calc(var(--rh) * .36); max-width: 96%; margin-top: 4px; object-fit: contain; }
  .mid.vs, .mb .sc.vs { display: flex !important; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mid.vs > span, .mb .sc.vs > span { line-height: 1; }
  .mid.vs small, .mb .sc.vs small { margin-top: 6px !important; text-align: center; }
  .dh { height: calc(var(--rh) * .42); display: flex; align-items: flex-end; padding-left: 8px; color: var(--aqua); font-weight: 900; font-size: calc(var(--rh) * .24); letter-spacing: 1.5px; text-transform: uppercase; }
  .row .dt { padding-left: calc(var(--cut) + 14px); line-height: 1.05; white-space: nowrap; color: var(--aqua); font-size: calc(var(--rh) * .24); text-transform: uppercase; }
  .row .dt small { display: block; color: #fff; font-size: calc(var(--rh) * .22); }
  .lo { height: calc(var(--rh) * .66); width: calc(var(--rh) * .66); justify-self: center; background: #fff; display: grid; place-items: center; overflow: hidden;
             clip-path: polygon(14% 0, 100% 0, 100% 86%, 86% 100%, 0 100%, 0 14%); color: var(--ink); font-weight: 900; font-size: calc(var(--rh) * .17); }
  .lo img { width: 84%; height: 84%; object-fit: contain; }
  .row .tn { padding: 0 calc(var(--rh) * .16); font-size: calc(var(--rh) * .3); white-space: nowrap; overflow: hidden; text-transform: uppercase; }
  .row .tn.h { text-align: right; } .tn.l { color: rgba(255,255,255,.55); }
  .row .mid { height: 100%; display: grid; place-items: center; align-content: center; background: var(--aqua); color: var(--ink); font-weight: 900; font-size: calc(var(--rh) * .4); }
  .row .mid.vs { background: var(--slate2); color: #fff; font-size: calc(var(--rh) * .3); }
  .row .mid.live { background: #ff5a6b; color: #fff; }
  .row .mid small { font-size: calc(var(--rh) * .15); font-weight: 800; letter-spacing: 1px; line-height: 1; opacity: .8; }
  .s { grid-template-columns: var(--rkW) var(--logoW) 1fr repeat(3, var(--numW)) var(--setW) var(--ptsW); }
  .s .rk { height: 100%; display: grid; place-items: center; background: var(--slate2); font-size: calc(var(--rh) * .38); font-weight: 900; }
  .s.hl .rk, .s.top .rk { background: var(--aqua); color: var(--ink); }
  .s .n { text-align: center; font-size: calc(var(--rh) * .32); font-weight: 700; }
  .s .pts { height: 100%; display: grid; place-items: center; background: var(--aqua); color: var(--ink); font-size: calc(var(--rh) * .4); font-weight: 900; }
  .sh { height: calc(var(--rh) * .5); background: none; box-shadow: none; font-size: calc(var(--rh) * .22); color: var(--aqua); text-transform: uppercase; letter-spacing: 1px; }
  .sh .n, .sh .pts { background: none; color: var(--aqua); font-size: calc(var(--rh) * .22); }
  .ftr { position: absolute; left: 0; right: 0; bottom: 0; height: var(--ftH); display: flex; align-items: center; justify-content: center; gap: 22px;
         background: linear-gradient(100deg, rgba(36,44,59,.92), rgba(23,28,39,.92)); border-top: 4px solid var(--aqua); font-weight: 800; font-size: calc(var(--ftH) * .32); letter-spacing: 1px; text-transform: uppercase; }
  .ftr b { color: var(--aqua); }
  .bars { position: absolute; top: 0; right: 0; width: 220px; height: var(--barsH); pointer-events: none; opacity: .9; overflow: hidden; }
  .bars i { position: absolute; top: -5%; height: 110%; background: var(--aqua); transform: skewX(-8deg); }
  .m-only, .p-only { display: none !important; } body.t-match .m-only { display: flex !important; } body.t-match.s-players .p-only { display: flex !important; } body.t-match .r-only, body.t-standings .r-only { display: none !important; }

  /* ---------- match announcement: logo boxes ---------- */
  .mx { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--vsW) minmax(0, 1fr); align-items: start; padding: 0 var(--sideP); }
  .mx .side { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--box) * .1); }
  .mx .box { width: var(--box); height: var(--box); background: #fff; display: grid; place-items: center; color: var(--ink); font-weight: 900; font-size: calc(var(--box) * .2);
             clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); filter: drop-shadow(0 0 40px rgba(153,245,253,.35)); }
  .mx .box img { width: 82%; height: 82%; object-fit: contain; }
  .mx .tname { width: 100%; height: calc(var(--box) * .52); display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 6px 42px; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(47,57,75,.97));
               box-shadow: inset 0 -4px 0 var(--aqua); font-weight: 900; font-size: calc(var(--box) * .16); line-height: 1.05; text-transform: uppercase; overflow: hidden; }
  .mx .vs { align-self: center; margin-top: calc(var(--box) * -.2); height: calc(var(--box) * .5); display: grid; place-items: center; background: var(--aqua); color: var(--ink);
            font-weight: 900; font-style: italic; font-size: calc(var(--box) * .26); --cut: 22px; }
  .when { position: absolute; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 1fr auto; width: var(--whenW); height: var(--whenH); background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(29,36,49,.97)); box-shadow: inset 0 -4px 0 var(--aqua); --cut: 26px; }
  .when .d { display: grid; place-items: center; font-weight: 900; font-size: calc(var(--whenH) * .36); text-transform: uppercase; white-space: nowrap; padding: 0 30px; overflow: hidden; }
  .when .t { display: grid; place-items: center; padding: 0 46px; background: var(--aqua); color: var(--ink); font-weight: 900; font-size: calc(var(--whenH) * .5); }
  /* boxes style: day box with the time box centred under it */
  .when2 { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .when2 .d { height: var(--whenH); padding: 0 70px; display: grid; place-items: center; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(29,36,49,.97)); box-shadow: inset 0 -4px 0 var(--aqua);
              font-weight: 900; font-size: calc(var(--whenH) * .38); text-transform: uppercase; white-space: nowrap; --cut: 26px; }
  .when2 .t { height: calc(var(--whenH) * .82); padding: 0 56px; display: grid; place-items: center; background: var(--aqua); color: var(--ink); font-weight: 900; font-size: calc(var(--whenH) * .5); --cut: 22px; }
  .lgTL { position: absolute; z-index: 6; width: auto; object-fit: contain; }
  .tvL { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; width: auto; max-width: 340px; object-fit: contain; }
  .venue { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); width: var(--whenW); text-align: center; font-weight: 800; font-size: calc(var(--whenH) * .3); text-transform: uppercase; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; }
  .venue b { color: var(--aqua); }

  /* ---------- match announcement: player photos (reference style) ---------- */
  .pv { position: absolute; inset: 0; }
  .pv .streak { position: absolute; top: -20%; height: 140%; width: 3px; background: linear-gradient(180deg, transparent, var(--aqua) 40%, #fff 50%, var(--aqua) 60%, transparent); transform: rotate(24deg); opacity: .7; filter: drop-shadow(0 0 10px var(--aqua)); }
  .pv .streak.w { width: 90px; opacity: .08; background: linear-gradient(90deg, transparent, var(--aqua), transparent); filter: none; }
  .pv .bigvs { position: absolute; left: 50%; top: var(--vsTop); transform: translateX(-50%); font-weight: 900; font-style: italic; font-size: var(--vsSize); line-height: .8; letter-spacing: -6px;
               color: rgba(255,255,255,.88); text-shadow: 0 0 60px rgba(153,245,253,.45); z-index: 1; }
  .pv .player { position: absolute; bottom: var(--phB); height: var(--phH); width: var(--phW); display: flex; align-items: flex-end; justify-content: center; z-index: 2; }
  .pv .player img.ph { max-height: 100%; max-width: 100%; object-fit: contain; object-position: bottom; -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
                       filter: drop-shadow(0 0 30px rgba(0,0,0,.6)); }
  .pv .player .ghost { width: 70%; height: 70%; margin-bottom: 15%; opacity: .14; object-fit: contain; }
  .pv .tlogo { position: absolute; bottom: var(--tlB); width: var(--tl); height: var(--tl); background: #fff; display: grid; place-items: center; z-index: 3; color: var(--ink); font-weight: 900; font-size: calc(var(--tl) * .22);
               clip-path: polygon(12% 0, 100% 0, 100% 88%, 88% 100%, 0 100%, 0 12%); }
  .pv .tlogo img { width: 82%; height: 82%; object-fit: contain; }
  .pv .tblock { position: absolute; top: var(--tbTop); width: var(--tbW); height: var(--tbH); z-index: 3; display: flex; flex-direction: column; justify-content: center; }
  .pv .tblock.r { text-align: right; align-items: flex-end; }
  .pv .tblock.c { text-align: center; align-items: center; }
  .pv .tblock .tn2 { width: 100%; }
  .pv .tblock small { font-weight: 800; font-size: calc(var(--tbFs) * .32); letter-spacing: 2px; color: rgba(255,255,255,.75); text-transform: uppercase; }
  .pv .tblock .tn2 { font-weight: 900; font-style: italic; font-size: var(--tbFs); line-height: .98; color: var(--aqua); text-transform: uppercase; overflow: hidden; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .pv .info { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--infoB); z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pv .info .d { height: var(--whenH); display: flex; align-items: stretch; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(29,36,49,.97)); box-shadow: inset 0 -4px 0 var(--aqua); --cut: 24px; }
  .pv .info .d span { display: grid; place-items: center; padding: 0 34px; font-weight: 900; font-size: calc(var(--whenH) * .38); text-transform: uppercase; white-space: nowrap; }
  .pv .info .d span.t { background: var(--aqua); color: var(--ink); font-size: calc(var(--whenH) * .48); }
  .pv .info .v { font-weight: 800; font-size: calc(var(--whenH) * .28); color: rgba(255,255,255,.85); text-transform: uppercase; white-space: nowrap; }
  .pv .info .v b { color: var(--aqua); }
  .pv .top { position: absolute; top: var(--padT); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 4; }
  .pv .top img { height: var(--logoH); }
  .pv .top .st { height: calc(var(--ttH) * .55); padding: 0 46px; display: grid; place-items: center; background: var(--slate2); border-bottom: 3px solid var(--aqua); font-weight: 800; font-size: calc(var(--ttH) * .28); letter-spacing: 1.5px; text-transform: uppercase; }
  .mx .tname span { display: block; width: 100%; white-space: nowrap; overflow: hidden; }
  /* photo panels (players style) */
  .pv2 { position: absolute; inset: 0; overflow: hidden; }
  /* glowing light beams along the panel sides (white core + aqua bloom, fading at both ends) */
  .pv2 .edge { position: absolute; width: 4px; transform-origin: 50% 50%; z-index: 3;
               background: linear-gradient(180deg, transparent 0%, rgba(153,245,253,.55) 18%, #fff 42%, #fff 58%, rgba(153,245,253,.55) 82%, transparent 100%);
               box-shadow: 0 0 6px 1px rgba(255,255,255,.9), 0 0 22px 6px rgba(153,245,253,.75), 0 0 60px 18px rgba(153,245,253,.35); }
  .pv2 .edge::before { content: ''; position: absolute; left: 50%; top: 20%; width: 46px; height: 60%; transform: translateX(-50%);
               background: radial-gradient(ellipse at center, rgba(153,245,253,.35), transparent 70%); filter: blur(8px); }
  .pv2 .edge::after { content: ''; position: absolute; left: 50%; top: 32%; width: 16px; height: 36%; transform: translateX(-50%);
               background: radial-gradient(ellipse at center, rgba(255,255,255,.95), rgba(153,245,253,.5) 40%, transparent 72%); filter: blur(2px); }
  .pv2 .edge.faint { width: 2px; opacity: .25; box-shadow: 0 0 12px 3px rgba(153,245,253,.4); z-index: 0; }
  .pv2 .edge.faint::before, .pv2 .edge.faint::after { display: none; }
  .pv2 .pp { position: absolute; z-index: 2; clip-path: polygon(var(--off) 0, 100% 0, calc(100% - var(--off)) 100%, 0 100%); }
  .pv2 .ppi { position: absolute; inset: 0; background: linear-gradient(180deg, #2f394b, #171c27); overflow: hidden; display: grid; place-items: center; }
  .pv2 .ppi .photo { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .pv2 .ppi::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,19,35,.25), transparent 30%, transparent 70%, rgba(12,19,35,.55)); pointer-events: none; }
  .pv2 .ppi .ghost2 { width: 55%; opacity: .16; }
  .pv2 .tlogo2 { position: absolute; z-index: 5; background: #fff; display: grid; place-items: center; color: var(--ink); font-weight: 900; font-size: 26px;
                 clip-path: polygon(12% 0, 100% 0, 100% 88%, 88% 100%, 0 100%, 0 12%); filter: drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
  .pv2 .tlogo2 img { width: 82%; height: 82%; object-fit: contain; }
  .pv2 .nm2 { position: absolute; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; }
  .pv2 .nm2 small { font-weight: 800; font-size: 18px; font-style: normal; letter-spacing: 3px; color: rgba(255,255,255,.7); margin-bottom: 4px; }
  .pv2 .nm2 .tn2 { font-size: 1em; width: 100%; white-space: nowrap; overflow: hidden; font-weight: 900; font-style: italic; color: var(--aqua); text-transform: uppercase; line-height: 1.05; }
  .pv2 .bigvs2 { position: absolute; left: 50%; transform: translateX(-50%); z-index: 4; font-weight: 900; font-style: italic; line-height: .8; letter-spacing: -4px; color: #fff;
                 text-shadow: 0 0 40px rgba(153,245,253,.6), 0 10px 40px rgba(0,0,0,.7); }
  .pv2 .hdr { z-index: 6; }
  .pv2 .lg2 { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; }
  .pv2 .strip { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; height: 50px; padding: 0 46px; display: grid; place-items: center; white-space: nowrap; background: var(--slate2); border-bottom: 3px solid var(--aqua); font-weight: 800; font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase; }
  .pv2 .d2 { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; height: var(--whenH); display: flex; align-items: stretch; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(29,36,49,.97)); box-shadow: inset 0 -4px 0 var(--aqua); --cut: 24px; }
  .pv2 .d2 span { display: grid; place-items: center; padding: 0 34px; font-weight: 900; font-size: calc(var(--whenH) * .38); text-transform: uppercase; white-space: nowrap; }
  .pv2 .d2 span.t { background: var(--aqua); color: var(--ink); font-size: calc(var(--whenH) * .48); }

<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Head coaches</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* Both head coaches face to face, assistants underneath.  ?side=home|away shows one team only */
  #box { position: absolute; left: 50%; top: 100px; width: 1500px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .title-pill { width: 900px; } .comp-pill { width: 900px; margin-top: 12px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; width: 1500px; margin-top: 34px; }
  .pair.one { grid-template-columns: 1fr; width: 720px; }
  .coach { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto auto 1fr; column-gap: 26px; row-gap: 12px; align-items: start; }
  .coach .ph2 { grid-row: 1 / 4; width: 250px; height: 310px; border-radius: 26px; overflow: hidden; background: var(--navy-800); box-shadow: inset 0 0 0 4px #fff; }
  .coach .ph2 img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  .coach .ph2.nophoto { display: grid; place-items: center; font-size: 90px; font-weight: 900; }
  .coach .tm { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 28px; text-transform: uppercase; }
  .coach .tm .logo { width: 64px; height: 64px; } .coach .tm .logo.fallback { font-size: 16px; }
  .coach .cn { min-height: 92px; display: flex; flex-direction: column; justify-content: center; padding: 8px 30px; border-radius: 30px; background: var(--g-row); box-shadow: inset 0 0 0 var(--line) #fff; }
  .coach .cn b { font-size: 42px; font-weight: 900; text-transform: uppercase; line-height: 1.05; } .coach .cn span { font-size: 28px; font-weight: 500; }
  .coach .cr { justify-self: start; height: 44px; padding: 0 26px; display: flex; align-items: center; border-radius: 999px; background: linear-gradient(90deg, var(--red-500), var(--red-700)); font-weight: 800; font-size: 22px; text-transform: uppercase; }
  .coach .as { grid-column: 1 / 3; margin-top: 14px; font-size: 22px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .coach .as b { color: #fff; margin-right: 18px; }
</style>
</head><body>
<div id="stage"><div id="box"></div></div>
<script>
const split = (n) => { const parts = String(n || '').split(/\s+/); const up = parts.filter((w) => w === w.toUpperCase() && /\p{L}/u.test(w)); const lo = parts.filter((w) => !up.includes(w)); return { last: up.join(' ') || n, first: lo.join(' ') }; };
const card = (t) => {
  const staff = t.staff || [];
  const head = staff.find((x) => /head|πρώτος|^coach$/i.test(x.role || '')) || t.coach || staff[0];
  if (!head) return '';
  const nm = split(head.name);
  const asst = staff.filter((x) => x !== head && /coach|προπον/i.test(x.role || ''));
  return `<div class="coach">
    <div class="ph2 ${head.photo ? '' : 'nophoto'}" data-i="${HVL.esc(nm.last[0] || '')}">${head.photo ? `<img src="${HVL.esc(head.photo)}" onerror="this.parentNode.classList.add('nophoto');this.replaceWith(this.parentNode.dataset.i)">` : HVL.esc(nm.last[0] || '')}</div>
    <div class="tm">${HVL.logo(t)}<span class="fit">${HVL.esc(t.short)}</span></div>
    <div class="cn"><b class="fit">${HVL.esc(nm.last)}</b><span>${HVL.esc(nm.first)}</span></div>
    <div class="cr">${HVL.lang === 'el' ? 'Προπονητής' : 'Head coach'}</div>
    ${asst.length ? `<div class="as">${asst.map((a) => `${HVL.esc(a.role)}: <b>${HVL.esc(a.name)}</b>`).join(' ')}</div>` : ''}
  </div>`;
};
HVL.poll('match', 60, (d, first) => {
  const box = HVL.$('#box');
  if (!d.match) { box.innerHTML = ''; return HVL.msg(d.message); }
  const one = HVL.get('side');
  const teams = one === 'home' ? [d.home] : one === 'away' ? [d.away] : [d.home, d.away];
  box.innerHTML = `
    <div class="pill title-pill">${HVL.esc(HVL.get('title') || (HVL.lang === 'el' ? 'Προπονητές' : 'Head coaches'))}</div>
    <div class="pill comp-pill">${HVL.esc(d.league.name)}</div>
    <div class="pair anim ${teams.length === 1 ? 'one' : ''}">${teams.map(card).join('')}</div>`;
  HVL.animate(box, first);
  HVL.animate(box.querySelector('.pair'), first);
});
</script>
</body></html>

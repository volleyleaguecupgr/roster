<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match announcement</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* Pre-match / "up next" card.  Uses mode=next by default; ?mode=auto for today's game. */
  #box { position: absolute; left: 50%; top: 120px; width: 1500px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .title-pill { width: 900px; } .comp-pill { width: 900px; margin-top: 12px; }
  .vs { margin-top: 40px; width: 1500px; display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .side .logo { width: 260px; height: 260px; box-shadow: 0 0 0 6px #fff, 0 0 60px rgba(42,51,240,.6); }
  .side .logo.fallback { font-size: 70px; }
  .side .nm { height: 92px; width: 560px; border-radius: 999px; display: grid; place-items: center; font-size: 46px; font-weight: 900; text-transform: uppercase; padding: 0 30px;
              background: var(--g-row); box-shadow: inset 0 0 0 var(--line) #fff; }
  .side .rk { font-size: 26px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .side .rk b { color: #fff; }
  .mid { display: grid; place-items: center; } .mid .v { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; background: var(--g-title); font-weight: 900; font-size: 64px; box-shadow: inset 0 0 0 4px #fff; text-transform: uppercase; }
  .when { margin-top: 46px; height: 100px; width: 900px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding-left: 90px; box-shadow: inset 0 0 0 4px #fff; background: rgba(8,12,58,.6); font-size: 44px; font-weight: 800; text-transform: uppercase; }
  .when .t { background: var(--g-win); height: 100px; padding: 0 50px; border-radius: 999px; display: grid; place-items: center; box-shadow: inset 0 0 0 4px #fff; }
  .venue-pill { width: 900px; margin-top: 22px; } .tag-pill { margin-top: 14px; }
</style>
</head><body>
<div id="stage"><div id="box"></div></div>
<script>
if (!HVL.P.has('mode')) HVL.mode = 'next';
HVL.poll('match', 60, (d, first) => {
  const box = HVL.$('#box');
  if (!d.match) { box.innerHTML = ''; return HVL.msg(d.message); }
  const m = d.match, dt = HVL.dateLong(m.iso);
  const side = (t) => `<div class="side">${HVL.logo(t)}<div class="nm fit">${HVL.esc(t.short)}</div>
    ${t.standing ? `<div class="rk"><b>${HVL.ord(t.standing.rank)}</b> · ${t.standing.rankPts} ${HVL.lang === 'el' ? 'βαθμοί' : 'pts'} · ${t.standing.won}-${t.standing.lost}</div>` : ''}</div>`;
  box.innerHTML = `
    <div class="pill title-pill">${HVL.esc(HVL.get('title') || (m.status === 'upcoming' ? HVL.t('next') : HVL.t('match')))}</div>
    <div class="pill comp-pill">${HVL.esc(d.league.name)}</div>
    <div class="vs">${side(d.home)}<div class="mid"><div class="v">${HVL.t('vs')}</div></div>${side(d.away)}</div>
    <div class="when"><span>${HVL.esc(dt.weekday)} ${HVL.esc(dt.date)}</span><span class="t">${HVL.esc(dt.time)}</span></div>
    ${m.venue ? `<div class="pill venue-pill">${HVL.esc(m.venue)}</div>` : ''}
    ${m.round ? `<div class="pill tag-pill">${HVL.esc(m.round)}</div>` : ''}`;
  HVL.animate(box, first);
});
</script>
</body></html>

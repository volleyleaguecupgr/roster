<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcement</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* ?title=…&text=…&style=center|lower   (no text → follows control.html announcement) */
  #box { position: absolute; left: 50%; top: 330px; width: 1300px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
  #box.lower { top: auto; bottom: 90px; left: 150px; transform: none; align-items: flex-start; }
  .title-pill { min-width: 700px; }
  .txt { margin-top: 18px; width: 1300px; min-height: 120px; padding: 26px 70px; border-radius: 60px; display: grid; place-items: center; text-align: center;
         background: var(--g-row); box-shadow: inset 0 0 0 4px #fff; font-size: 46px; font-weight: 700; line-height: 1.2; }
  #box.lower .txt { width: auto; max-width: 1600px; border-radius: 0 999px 999px 0; text-align: left; place-items: start; }
  #box.lower .title-pill { border-radius: 0 999px 999px 0; min-width: 0; background: linear-gradient(90deg, var(--red-500), var(--red-700)); }
  .hidden { opacity: 0; }
</style>
</head><body>
<div id="stage"><div id="box" class="hidden"></div></div>
<script>
const box = HVL.$('#box');
if (HVL.get('style') === 'lower') box.classList.add('lower');
function render(title, text, show, first) {
  if (!show || (!title && !text)) { box.classList.add('hidden'); return; }
  box.innerHTML = `${title ? `<div class="pill title-pill">${HVL.esc(title)}</div>` : ''}${text ? `<div class="txt">${HVL.esc(text).replace(/\n/g, '<br>')}</div>` : ''}`;
  box.classList.remove('hidden');
  HVL.animate(box, first);
}
if (HVL.get('text') || HVL.get('title')) {
  document.addEventListener('DOMContentLoaded', () => render(HVL.get('title'), HVL.get('text'), true, true));
} else {
  HVL.poll('state', 4, (s) => { const a = s.announcement || {}; render(a.title, a.text, a.show, true); });
}
</script>
</body></html>

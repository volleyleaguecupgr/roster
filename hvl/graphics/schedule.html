<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gameday schedule / results</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* schedule.html → current gameday (the selected team's match)   results.html → previous gameday
     ?which=prev|current|next|last|<round label>   ?title=   ?highlight=0 */
  #box { position: absolute; left: 50%; top: 90px; width: 1500px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .title-pill { width: 900px; } .comp-pill { width: 900px; margin-top: 12px; margin-bottom: 18px; }
  .rw { width: 1500px; height: 96px; margin-top: 12px; display: grid; grid-template-columns: 250px 84px 1fr 190px 1fr 84px; align-items: center;
        border-radius: 999px; background: var(--g-row); box-shadow: inset 0 0 0 var(--line) #fff; }
  .rw .dt { padding-left: 44px; font-weight: 800; font-size: 28px; text-transform: uppercase; color: var(--red-500); white-space: nowrap; }
  .rw .dt small { display: block; font-size: 20px; color: var(--muted); font-weight: 700; }
  .rw .logo { width: 70px; height: 70px; justify-self: center; } .rw .logo.fallback { font-size: 18px; }
  .rw .tn { font-weight: 800; font-size: 36px; text-transform: uppercase; white-space: nowrap; overflow: hidden; padding: 0 22px; }
  .rw .tn.h { text-align: right; } .rw .tn.w { color: #fff; } .rw .tn.l { color: var(--muted); }
  .rw .v { height: 96px; display: grid; place-items: center; font-weight: 900; font-size: 44px; background: var(--g-win); box-shadow: inset 0 0 0 var(--line) #fff; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .rw .v.vs { background: var(--navy-900); font-size: 30px; }
  .rw .v.live { background: var(--red-600); }
  .rw .v small { display: block; font-size: 16px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .rw.hl { background: linear-gradient(90deg, rgba(42,51,240,.65), var(--navy-800) 60%); }
  .tag-pill { margin-top: 22px; }
</style>
</head><body>
<div id="stage"><div id="box"></div></div>
<script>
const RESULTS = /results/.test(location.pathname);
const WHICH = HVL.get('which', RESULTS ? 'prev' : 'current');
const MONTHS = { en: 'JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC', el: 'ΙΑΝ ΦΕΒ ΜΑΡ ΑΠΡ ΜΑΪ ΙΟΥΝ ΙΟΥΛ ΑΥΓ ΣΕΠ ΟΚΤ ΝΟΕ ΔΕΚ' };
const mon = (i) => (MONTHS[HVL.lang] || MONTHS.en).split(' ')[i];
HVL.poll('round', RESULTS ? 120 : 30, (d, first) => {
  const box = HVL.$('#box');
  const r = d.round;
  if (!r) { box.innerHTML = ''; return HVL.msg(d.message || 'no gameday'); }
  const focus = HVL.get('highlight') === '0' ? null : HVL.team;
  const isFocus = (m) => focus && [m.home, m.away].some((t) => String(t.id) === String(focus) || (t.short || '').toLowerCase().includes(String(focus).toLowerCase()));
  const allDone = r.matches.every((m) => m.status === 'finished');
  const title = HVL.get('title') || (RESULTS || allDone ? (HVL.lang === 'el' ? 'Αποτελέσματα' : 'Results') : (HVL.lang === 'el' ? 'Πρόγραμμα' : 'Schedule'));
  box.innerHTML = `
    <div class="pill title-pill">${HVL.esc(title)}</div>
    <div class="pill comp-pill">${HVL.esc(d.league?.name || '')}</div>
    ${r.matches.slice(0, 8).map((m) => {
      const [dd, mm] = (m.date || '').split('/');
      const done = m.status === 'finished', live = m.status === 'live';
      const hw = done && m.setsHome > m.setsAway, aw = done && m.setsAway > m.setsHome;
      const mid = done ? `<div class="v">${m.setsHome}–${m.setsAway}</div>`
        : live ? `<div class="v live"><span>${m.setsHome}–${m.setsAway}</span><small>${HVL.lang === 'el' ? 'ΖΩΝΤΑΝΑ' : 'LIVE'}</small></div>`
        : `<div class="v vs">${HVL.esc(m.time || 'vs')}</div>`;
      return `<div class="rw ${isFocus(m) ? 'hl' : ''}">
        <div class="dt">${dd ? `${+dd} ${mon(+mm - 1)}` : ''}</div>
        ${HVL.logo(m.home)}<div class="tn h fit ${done ? (hw ? 'w' : 'l') : ''}">${HVL.esc(m.home.short)}</div>
        ${mid}
        <div class="tn fit ${done ? (aw ? 'w' : 'l') : ''}">${HVL.esc(m.away.short)}</div>${HVL.logo(m.away)}
      </div>`;
    }).join('')}
    <div class="pill tag-pill">${HVL.esc([r.phase && !/regular/i.test(r.phase) ? r.phase : '', r.label].filter(Boolean).join(' · '))}</div>`;
  HVL.animate(box, first);
}, () => ({ which: WHICH, mode: HVL.mode }));
</script>
</body></html>

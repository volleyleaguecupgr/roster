<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>Basket cards</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wdth,wght@62.5..100,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1220;  --bg-2:#111C30;  --bg-3:#18263F;
    --edge:rgba(255,255,255,.14);   /* top highlight */
    --line:rgba(255,255,255,.07);
    --text:#F4F7FB; --muted:#8B99B2;
    --accent:#1D4ED8; --accent-hi:#8DB0FF; --on-accent:#FFFFFF;   /* ?accent=HEX */
    --home:#1D4ED8; --on-home:#fff; --away:#C8102E; --on-away:#fff;
    --cut:22px;
    --font:"Noto Sans Display","Arial Narrow",sans-serif;
    --ease:cubic-bezier(.7,0,.2,1);
    --out:cubic-bezier(.2,.8,.2,1);
  }
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:var(--font);color:var(--text)}
  img{object-fit:contain;display:block}
  .num{font-variant-numeric:tabular-nums;font-stretch:72%;letter-spacing:-.5px}
  .up{text-transform:uppercase}

  /* ---------- placement ---------- */
  #stage{position:absolute;visibility:hidden}
  #stage.on{visibility:visible}
  #stage.lower{left:50%;bottom:78px;transform:translateX(-50%)}
  #stage.center{left:50%;top:50%;transform:translate(-50%,-50%)}
  #stage.half{left:0;right:0;bottom:0}
  #stage.full{inset:0}
  #stage.board{left:50%;bottom:52px;transform:translateX(-50%)}
  #stage.pbar{left:50%;bottom:var(--pbb,178px);transform:translateX(-50%)}

  /* ---------- layered panel: accent slab behind, angled cuts, glass edge ---------- */
  .fx{position:relative;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
  .fx::before{content:"";position:absolute;inset:0;transform:translate(-14px,14px);background:var(--accent);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .fx.noslab::before{display:none}
  .card{position:relative;overflow:hidden;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--bg-2) 0,var(--bg) 100%);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    box-shadow:inset 0 1px 0 var(--edge)}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);
    background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%)}

  /* header: accent parallelogram + meta */
  .hdr{display:flex;align-items:stretch;height:58px;border-bottom:1px solid var(--line)}
  .hdr .tag{display:flex;align-items:center;gap:14px;padding:0 44px 0 30px;background:var(--accent);color:var(--on-accent);
    clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
  .hdr .tag img{width:36px;height:36px;background:#fff;padding:4px;box-sizing:border-box}
  .hdr h2{margin:0;font-size:25px;font-weight:800;font-stretch:78%;letter-spacing:.3px}
  .hdr .meta{display:flex;align-items:center;margin-left:auto;padding:0 30px;font-size:18px;color:var(--muted);font-weight:600;font-stretch:85%}

  /* team header with colour wash */
  .th{position:relative;display:flex;align-items:center;gap:16px;height:72px;padding:0 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent) 0,transparent 75%)}
  .th.away{--c:var(--away)} .th.home{--c:var(--home)}
  .th::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .th img{width:48px;height:48px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .th .n{font-size:28px;font-weight:800;font-stretch:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th .s{margin-left:auto;display:grid;place-items:center;min-width:84px;height:50px;background:#fff;color:var(--bg);font-size:36px;font-weight:900;
    clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
  .two{display:grid;grid-template-columns:1fr 1fr}
  .two > div + div{border-left:1px solid var(--line)}

  /* ---------- lists ---------- */
  .pl{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:18px;height:42px;padding:0 24px;border-bottom:1px solid var(--line)}
  .pl .j{display:grid;place-items:center;height:30px;font-size:20px;font-weight:900;background:var(--home);color:var(--on-home);
    clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
  .away .pl .j{background:var(--away);color:var(--on-away)}
  .pl .nm{font-size:22px;font-weight:600;font-stretch:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .nm b{font-weight:800}
  .pl .tg{font-size:13px;font-weight:700;color:var(--accent-hi);letter-spacing:.4px}
  .starters .pl{height:70px;grid-template-columns:72px 1fr}
  .starters .pl .j{height:48px;font-size:30px}
  .starters .pl .nm{font-size:22px;color:var(--muted)}
  .starters .pl .nm b{display:block;font-size:32px;color:var(--text);line-height:1}

  .lr{display:grid;grid-template-columns:122px 1fr auto;align-items:center;gap:16px;height:56px;padding:0 24px;border-bottom:1px solid var(--line)}
  .lr span{font-size:16px;color:var(--muted);font-weight:700}
  .lr i{font-style:normal;font-size:23px;font-weight:600;font-stretch:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lr i em{font-style:normal;color:var(--muted);margin-right:6px}
  .lr b{font-size:36px;font-weight:900}

  /* ---------- comparison ---------- */
  .vs{display:grid;grid-template-columns:1fr 1fr}
  .vs > .th,.two > div{min-width:0}
  .vs .th.away{flex-direction:row-reverse;background:linear-gradient(270deg,color-mix(in srgb,var(--c) 55%,transparent) 0,transparent 75%)}
  .vs .th.away::before{left:auto;right:0}
  .vs .th.away .s{margin-left:0;margin-right:auto}
  .cr{display:grid;grid-template-columns:210px 1fr 210px;align-items:center;gap:24px;height:52px;padding:0 28px;border-bottom:1px solid var(--line)}
  .cv{font-size:28px;font-weight:800}
  .cv.a{text-align:right}
  .cv em{font-style:normal;font-weight:600;font-size:18px;color:var(--muted);margin:0 8px}
  .cv.lead{color:var(--accent-hi)}
  .cm b{display:block;text-align:center;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .bars span{display:flex;height:8px;background:rgba(255,255,255,.06)}
  .bars span.l{justify-content:flex-end}
  .bars i{display:block;height:100%;transform-origin:right}
  .bars .r i{transform-origin:left}
  .bars .l i{background:linear-gradient(270deg,var(--home),color-mix(in srgb,var(--home) 45%,transparent))}
  .bars .r i{background:linear-gradient(90deg,var(--away),color-mix(in srgb,var(--away) 45%,transparent))}

  /* ---------- tables ---------- */
  table.t{border-collapse:collapse;width:100%}
  .t th{height:40px;font-size:14px;font-weight:700;color:var(--muted);text-align:center;padding:0 8px;letter-spacing:.3px;border-bottom:1px solid var(--line)}
  .t td{height:40px;font-size:22px;font-weight:600;text-align:center;padding:0 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
  .t .l{text-align:left}
  .t .n{width:46px;color:var(--muted);font-weight:800}
  .t .nm{font-stretch:78%}
  .t .b{font-weight:900}
  .t .hi{color:var(--accent-hi)}
  .t tr.st .nm{font-weight:800}
  .t tr.tot td{font-weight:900;background:rgba(255,255,255,.05);border-bottom:0}
  .t tr.me td{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  .t tr.me .nm{font-weight:800}
  .t .tl{display:flex;align-items:center;gap:12px}
  .t .tl img{width:30px;height:30px}

  /* ---------- player / mvp ---------- */
  .pc{display:grid;grid-template-columns:250px 1fr;width:1160px;min-height:300px}
  .pc .jn{position:relative;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(160deg,var(--home) 0,color-mix(in srgb,var(--home) 55%,var(--bg)) 100%)}
  .pc.away .jn{background:linear-gradient(160deg,var(--away) 0,color-mix(in srgb,var(--away) 55%,var(--bg)) 100%)}
  .pc .jn b{font-size:190px;font-weight:900;font-stretch:65%;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.9)}
  .pc .jn img{position:absolute;left:16px;bottom:16px;width:56px;height:56px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .pc .bd{padding:26px 32px 26px}
  .pc .kick{display:inline-block;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;padding:5px 14px 5px 10px;letter-spacing:.5px;
    clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);margin-bottom:12px}
  .pc .fn{font-size:24px;font-weight:600;color:var(--muted);font-stretch:80%}
  .pc .ln{font-size:60px;font-weight:900;font-stretch:66%;line-height:.95;white-space:nowrap;overflow:hidden}
  .pc .tmn{margin:8px 0 20px;font-size:18px;color:var(--muted);font-weight:600}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .chip{background:var(--bg);padding:12px 14px}
  .chip b{display:block;font-size:40px;font-weight:900;line-height:1}
  .chip span{font-size:14px;color:var(--muted);font-weight:700}
  .chip.hi b{color:var(--accent-hi)}
  .chip.sm b{font-size:28px}

  /* ---------- score center ---------- */
  .sc{width:1240px}
  .sc .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:190px;position:relative}
  .sc .t{display:flex;align-items:center;gap:26px;padding:0 36px;height:100%;min-width:0}
  .sc .t.home{background:linear-gradient(90deg,color-mix(in srgb,var(--home) 45%,transparent),transparent 80%)}
  .sc .t.away{flex-direction:row-reverse;text-align:right;background:linear-gradient(270deg,color-mix(in srgb,var(--away) 45%,transparent),transparent 80%)}
  .sc .t img{width:110px;height:110px;flex:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
  .sc .t .n{font-size:40px;font-weight:900;font-stretch:66%;line-height:1.05;max-height:2.1em;overflow:hidden}
  .sc .s{display:flex;gap:4px}
  .sc .s b{display:grid;place-items:center;width:160px;height:130px;background:#fff;color:var(--bg);font-size:100px;font-weight:900}
  .sc .s b:first-child{clip-path:polygon(16px 0,100% 0,100% 100%,0 100%)}
  .sc .s b:last-child{clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
  .sc .foot{display:flex;justify-content:center;align-items:stretch;height:50px;border-top:1px solid var(--line)}
  .sc .foot .st{display:flex;align-items:center;padding:0 22px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:800}
  .sc .foot .q{display:flex;align-items:center;gap:8px;padding:0 18px;font-size:20px;font-weight:700;border-right:1px solid var(--line)}
  .sc .foot .q span{color:var(--muted);font-size:15px}

  /* ---------- scoreboard (lower) + empty deck for your clock / shot clock ---------- */
  .sbw{display:flex;flex-direction:column;align-items:center}
  .deck{position:relative;display:flex;height:50px;margin-top:6px}
  .deck .lg{position:absolute;right:100%;top:0;bottom:0;width:50px;background:#fff;display:grid;place-items:center;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
  .deck .lg img{width:38px;height:38px}
  .deck .clk{width:var(--clk,200px);background:var(--bg)}
  .deck .shot{width:var(--shot,86px);background:var(--accent);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
  .sb{display:grid;grid-template-columns:var(--nw,400px) 104px 104px var(--nw,400px);height:70px;
      background:linear-gradient(180deg,var(--bg-2),var(--bg));box-shadow:inset 0 1px 0 var(--edge);
      clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 100%,0 100%)}
  .sb .tm{position:relative;display:flex;align-items:center;gap:16px;padding:0 22px 0 36px;min-width:0;
      background:linear-gradient(90deg,color-mix(in srgb,var(--home) 60%,transparent),transparent 85%)}
  .sb .tm.away{flex-direction:row-reverse;padding:0 36px 0 22px;background:linear-gradient(270deg,color-mix(in srgb,var(--away) 60%,transparent),transparent 85%)}
  .sb .tm img{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
  .sb .tm .n{font-size:32px;font-weight:900;font-stretch:66%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb .pts{display:grid;place-items:center;background:#fff;color:var(--bg);font-size:48px;font-weight:900}
  .sb .pts + .pts{box-shadow:inset 2px 0 0 var(--bg)}
  .sb .pts.bump{animation:bump 1.4s var(--out)}

  /* ---------- player stat bar: sits on top of the scoreboard, same tapered shape ---------- */
  .pb{display:flex;align-items:stretch;height:60px;width:calc(2 * var(--nw,400px) + 208px - 36px);margin:0 auto 6px;
      background:linear-gradient(180deg,var(--bg-2),var(--bg));box-shadow:inset 0 1px 0 var(--edge);
      clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 100%,0 100%)}
  .pb .pj{display:grid;place-items:center;min-width:92px;padding:0 10px 0 26px;font-size:40px;font-weight:900;font-stretch:66%;
      background:var(--c);color:var(--on-c);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
  .pb.home{--c:var(--home);--on-c:var(--on-home)} .pb.away{--c:var(--away);--on-c:var(--on-away)}
  .pb .who{display:flex;align-items:center;gap:12px;padding:0 18px;min-width:0;flex:1;
      background:linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%)}
  .pb .who img{width:34px;height:34px;flex:none}
  .pb .who .nm{min-width:0;line-height:1}
  .pb .who .nm span{display:block;font-size:14px;font-weight:700;color:var(--muted);font-stretch:80%}
  .pb .who .nm b{display:block;font-size:30px;font-weight:900;font-stretch:64%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pb .st{display:flex;flex-direction:column;align-items:center;justify-content:center;width:104px;border-left:1px solid var(--line)}
  .pb .st b{font-size:32px;font-weight:900;line-height:1}
  .pb .st span{margin-top:3px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px}
  .pb .st.key{background:#fff;color:var(--bg);border-left:0}
  .pb .st.key span{color:var(--bg);opacity:.6}
  .pb .st:last-child{padding-right:14px;width:118px}
  @keyframes bump{0%{background:var(--accent);color:#fff;transform:scale(1.06)}100%{background:#fff;color:var(--bg);transform:none}}

  /* ---------- teaser (full) ---------- */
  .full-bg{position:absolute;inset:0;overflow:hidden;background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px),
      radial-gradient(900px 700px at 18% 55%,color-mix(in srgb,var(--home) 45%,transparent),transparent 70%),
      radial-gradient(900px 700px at 82% 55%,color-mix(in srgb,var(--away) 45%,transparent),transparent 70%),
      linear-gradient(180deg,#0E1830,var(--bg))}
  .full-bg .band{position:absolute;left:50%;top:-10%;width:380px;height:120%;background:var(--accent);transform:translateX(-50%) skewX(-14deg);opacity:.95}
  .full-bg .top{position:absolute;left:0;right:0;top:64px;display:flex;justify-content:center;align-items:center;gap:20px}
  .full-bg .top img{width:76px;height:76px;background:#fff;padding:8px;box-sizing:border-box}
  .full-bg .top h2{margin:0;font-size:38px;font-weight:900;font-stretch:72%}
  .full-bg .top span{display:block;font-size:22px;color:var(--muted);font-weight:600}
  .mu{position:absolute;inset:0;display:grid;grid-template-columns:1fr 380px 1fr;align-items:center;padding:0 80px}
  .mu .side{display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center}
  .mu .side img{width:330px;height:330px;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55))}
  .mu .side .n{font-size:62px;font-weight:900;font-stretch:64%;line-height:1;max-width:620px}
  .mu .mid{position:relative;text-align:center;color:var(--on-accent)}
  .mu .mid .t{font-size:132px;font-weight:900;line-height:1}
  .mu .mid .d{font-size:26px;font-weight:700;opacity:.9}
  .full-bg .bot{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;gap:40px;font-size:24px;color:var(--muted);font-weight:600}

  /* ---------- announcement (half) ---------- */
  .ann-wrap{position:relative;height:500px}
  .ann-wrap .card{position:absolute;inset:0;--cut:0px;clip-path:polygon(0 60px,100% 0,100% 100%,0 100%)}
  .ann{position:absolute;inset:170px 0 64px;display:grid;grid-template-columns:1fr 320px 1fr;align-items:center;padding:0 100px}
  .ann .side{display:flex;align-items:center;gap:30px}
  .ann .side.away{flex-direction:row-reverse;text-align:right}
  .ann img{width:170px;height:170px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
  .ann .n{font-size:50px;font-weight:900;font-stretch:64%;line-height:1;max-width:520px}
  .ann .mid{text-align:center}
  .ann .mid .t{font-size:96px;font-weight:900;line-height:1}
  .ann .mid .d{font-size:22px;color:var(--muted);font-weight:700}
  .ann .hdrline{position:absolute;left:100px;top:-78px;display:flex;align-items:center;gap:14px}
  .ann .hdrline img{width:44px;height:44px;background:#fff;padding:5px;box-sizing:border-box;filter:none}
  .ann .hdrline b{font-size:24px;font-weight:800;font-stretch:78%}
  .ann .hdrline span{color:var(--muted);font-weight:600}
  .ann-foot{position:absolute;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);color:var(--muted);font-size:20px;font-weight:600}

  /* ---------- fit long names ---------- */
function fit() {
  stage.querySelectorAll(".n, .ln, .pb .nm b").forEach(el => {
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize), min = fs * 0.62;
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; }
  });
}

/* ---------- motion ---------- */
  /* in: slab slides → panel opens like a shutter → light glint → header → rows cascade → numbers count up */
  .intro .fx::before{animation:slab .7s var(--out) both}
  .intro .fx .card,.intro .fx .sb,.intro .fx .deck,.intro .fx .pb{animation:shutter .9s var(--ease) .35s backwards}
  .intro .fx .pb .st{animation:rise .55s var(--out) backwards;animation-delay:calc(1s + var(--i,0) * 110ms)}
  .intro .card::after{animation:glint 1.1s ease-in-out 1.05s both}
  .intro .hdr .tag,.intro .th{animation:slide .7s var(--out) .95s backwards}
  .intro .rowin{animation:rise .6s var(--out) backwards;animation-delay:calc(1.2s + var(--i,0) * 90ms)}
  .intro .bars i{animation:grow .9s var(--out) backwards;animation-delay:calc(1.3s + var(--i,0) * 90ms)}
  .intro .full-bg{animation:fade .6s ease both}
  .intro .full-bg .band{animation:band 1.1s var(--ease) .2s backwards}
  .intro .mu .side:first-child{animation:fromL 1s var(--out) .7s backwards}
  .intro .mu .side:last-child{animation:fromR 1s var(--out) .7s backwards}
  .intro .mu .mid,.intro .full-bg .top,.intro .full-bg .bot{animation:rise .8s var(--out) 1.1s backwards}
  .outro .fx .card,.outro .fx .sb,.outro .fx .deck,.outro .fx .pb{animation:close .7s var(--ease) both}
  .outro .fx::before{animation:slabOut .6s var(--ease) .35s both}
  .outro .full-bg{animation:fadeOut .8s ease both}
  @keyframes slab{from{transform:translate(-60px,14px) skewX(-8deg);opacity:0}to{transform:translate(-14px,14px);opacity:1}}
  @keyframes slabOut{to{transform:translate(-60px,14px) skewX(-8deg);opacity:0}}
  @keyframes shutter{from{clip-path:polygon(0 50%,100% 50%,100% 50%,0 50%)}}
  @keyframes close{to{clip-path:polygon(0 50%,100% 50%,100% 50%,0 50%)}}
  @keyframes glint{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
  @keyframes slide{from{transform:translateX(-40px);opacity:0}}
  @keyframes rise{from{transform:translateY(14px);opacity:0}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes fade{from{opacity:0}}
  @keyframes fadeOut{to{opacity:0}}
  @keyframes band{from{transform:translateX(-50%) skewX(-14deg) translateY(-110%)}}
  @keyframes fromL{from{transform:translateX(-120px);opacity:0}}
  @keyframes fromR{from{transform:translateX(120px);opacity:0}}

  /* ---------- referees ---------- */
  .of{display:grid;grid-template-columns:1.2fr 1fr}
  .of > div + div{border-left:1px solid var(--line)}
  .of h3{margin:0;height:46px;display:flex;align-items:center;padding:0 26px;font-size:15px;font-weight:800;color:var(--accent-hi);letter-spacing:.6px;border-bottom:1px solid var(--line)}
  .ref{display:grid;grid-template-columns:64px 1fr;align-items:center;height:74px;padding:0 26px;border-bottom:1px solid var(--line)}
  .ref .k{font-size:34px;font-weight:900;font-stretch:66%;color:var(--muted)}
  .ref .v{font-size:32px;font-weight:800;font-stretch:70%}
  .ofr{display:grid;grid-template-columns:150px 1fr;align-items:center;height:52px;padding:0 26px;border-bottom:1px solid var(--line)}
  .ofr span{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.4px}
  .ofr b{font-size:23px;font-weight:700;font-stretch:78%}

  .note{position:absolute;left:20px;top:20px;background:var(--bg-2);color:var(--text);padding:8px 12px;font-size:18px;border-left:4px solid var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="note" class="note" hidden></div>

<script src="mm-data.js"></script>
<script>
/* URL: /md/card/<type>/<gameId>[/home|away[/jersey]] */
const qs = new URLSearchParams(location.search);
const parts = location.pathname.split("/").filter(Boolean);
/* URL: cards.html?type=score&id=<gameId>[&side=home|away][&jersey=8] */
const TYPE = qs.get("type") || parts[2], GAME = qs.get("id") || parts[3], SIDE = (qs.get("side") || parts[4] || "home").toLowerCase(), JERSEY = qs.get("jersey") || parts[5];
const POLL = Math.max(3, +qs.get("poll") || 5) * 1000;
const HOLD = +qs.get("hold") || 0;
const NEEDS_SEASON = ["rosters", "comparison"].includes(TYPE);
const $ = id => document.getElementById(id);
const css = document.documentElement.style;

/* ---------- helpers ---------- */
const pct = (m, a) => (a ? Math.round((100 * m) / a) : 0);
const ma = (m, a) => `${m}/${a}`;
const f1 = v => (Number.isInteger(+v) ? +v : (+v).toFixed(1));
const split = n => { const p = String(n || "").trim().split(/\s+/); return p.length > 1 ? [p.slice(0, -1).join(" "), p[p.length - 1]] : ["", p[0] || ""]; };
const shortName = n => { const [f, l] = split(n); return f ? `${f[0]}. ${l}` : l; };
const team = (side, m) => (side === "home" ? m.home : m.visitor);
const label = (side, m) => (side === "home" ? qs.get("home") : qs.get("away")) || team(side, m).name || "";
const UP = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
const _n = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const isFinal = m => /complet|finish|end|final/i.test(m.state || "");
const isUpcoming = m => !m.state || /upcoming|scheduled/i.test(m.state);
const periodNo = m => m.period || parseInt(String(m.period_raw || "").replace(/\D/g, "")) || null;
const qLabel = p => (p <= 4 ? `${p}η` : `Π${p - 4}`);
function when(m) {
  if (!m.date) return { d: "", t: "" };
  const dt = new Date(m.date), tz = { timeZone: "Europe/Athens" };
  return { d: dt.toLocaleDateString("el-GR", { ...tz, weekday: "long", day: "numeric", month: "long" }),
           t: dt.toLocaleTimeString("el-GR", { ...tz, hour: "2-digit", minute: "2-digit", hour12: false }) };
}
function stateText(m) {
  if (isFinal(m)) return "Τελικό";
  if (isUpcoming(m)) return when(m).t ? `Τζάμπολ ${when(m).t}` : "";
  const p = periodNo(m);
  return p ? (p <= 4 ? `${p}η περίοδος` : `Παράταση ${p - 4}`) : "Σε εξέλιξη";
}
function lum(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length < 6) return 0;
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const onColor = hex => (lum(hex) > 0.6 ? "#0A1220" : "#FFFFFF");
let colorsSet = false;
function setColors(m) {
  if (colorsSet) return;
  let hc = qs.get("hc") ? "#" + qs.get("hc") : m.home.color || "#1D4ED8";
  let vc = qs.get("vc") ? "#" + qs.get("vc") : m.visitor.color || "#C8102E";
  if (lum(hc) > 0.85) hc = "#9AA7BD";               // pure white team colour washes out on dark: use silver
  if (lum(vc) > 0.85) vc = "#9AA7BD";
  css.setProperty("--home", hc); css.setProperty("--on-home", onColor(hc));
  css.setProperty("--away", vc); css.setProperty("--on-away", onColor(vc));
  if (qs.get("accent")) { const a = "#" + qs.get("accent"); css.setProperty("--accent", a); css.setProperty("--on-accent", onColor(a));
    css.setProperty("--accent-hi", `color-mix(in srgb, ${a} 45%, #fff)`); }
  colorsSet = true;
}
const clogo = m => (m.competition_logo && qs.get("comp") !== "0" ? `<img src="${m.competition_logo}" alt="">` : "");
const hdr = (m, title, meta) => `<div class="hdr"><div class="tag">${clogo(m)}<h2>${title}</h2></div><div class="meta">${meta ?? m.competition ?? ""}</div></div>`;
const th = (side, m, score = true) => { const t = team(side, m);
  return `<div class="th ${side}"><img src="${t.logo || ""}" alt=""><div class="n up">${label(side, m)}</div>${score && !isUpcoming(m) ? `<div class="s num cu">${t.score ?? 0}</div>` : ""}</div>`; };
const two = (h, a) => `<div class="two"><div class="home">${h || ""}</div><div class="away">${a || ""}</div></div>`;
const nm2 = n => { const [f, l] = split(n); return `${f ? f + " " : ""}<b>${l}</b>`; };

/* ---------- cards ---------- */
const CARDS = {
  scoreboard(m) {
    ["clk", "shot", "nw"].forEach(k => qs.get(k) && css.setProperty("--" + k, qs.get(k) + "px"));
    const nm = side => qs.get(side) || (qs.get("names") === "short" ? team(side, m).short : null) || team(side, m).name;
    const deck = qs.get("deck") === "0" ? "" :
      `<div class="deck">${m.competition_logo && qs.get("comp") !== "0" ? `<div class="lg"><img src="${m.competition_logo}" alt=""></div>` : ""}<div class="clk"></div><div class="shot"></div></div>`;
    // ?player=h8 / a15 → stat bar on top of the scoreboard in the same source
    const pm = (qs.get("player") || "").match(/^([ha])(\d+)$/i);
    const bar = pm ? playerBar(m, pm[1].toLowerCase() === "h" ? "home" : "away", pm[2]) : "";
    return { pos: "board", slab: false, sb: true, html: `<div class="sbw">${bar}<div class="sb">
      <div class="tm home"><img src="${m.home.logo || ""}" alt=""><div class="n up">${nm("home")}</div></div>
      <div class="pts num" data-k="h">${m.home.score ?? 0}</div><div class="pts num" data-k="a">${m.visitor.score ?? 0}</div>
      <div class="tm away"><img src="${m.visitor.logo || ""}" alt=""><div class="n up">${nm("away")}</div></div></div>${deck}</div>` };
  },

  /* separate source that lines up exactly above the scoreboard: /md/card/playerbar/<id>/home/8 */
  playerbar(m) {
    if (qs.get("nw")) css.setProperty("--nw", qs.get("nw") + "px");
    css.setProperty("--pbb", (qs.get("deck") === "0" ? 52 + 70 + 6 : 52 + 70 + 6 + 50 + 6) + "px");
    const html = playerBar(m, SIDE, JERSEY);
    return html ? { pos: "pbar", slab: false, html } : null;
  },

  teaser(m) {
    const w = when(m), up = isUpcoming(m);
    return { pos: "full", slab: false, raw: true, html: `<div class="full-bg "><div class="band"></div>
      <div class="top">${clogo(m)}<div><h2 class="up">${m.competition || ""}</h2><span>${m.group || ""}</span></div></div>
      <div class="mu">
        <div class="side"><img src="${m.home.logo || ""}" alt=""><div class="n up">${label("home", m)}</div></div>
        <div class="mid"><div class="d">${w.d}</div><div class="t num">${up ? w.t : `${m.home.score ?? 0}-${m.visitor.score ?? 0}`}</div><div class="d">${up ? "Τζάμπολ" : stateText(m)}</div></div>
        <div class="side"><img src="${m.visitor.logo || ""}" alt=""><div class="n up">${label("away", m)}</div></div>
      </div><div class="bot"><span>${m.stadium || ""}</span></div></div>` };
  },

  announcement(m) {
    const w = when(m);
    return { pos: "half", slab: false, html: `<div class="ann-wrap"><div class="card ">
      <div class="ann">
        <div class="hdrline">${clogo(m)}<b class="up">${m.competition || ""}</b><span>${m.group || ""}</span></div>
        <div class="side rowin"><img src="${m.home.logo || ""}" alt=""><div class="n up">${label("home", m)}</div></div>
        <div class="mid rowin"><div class="d">${w.d}</div><div class="t num">${w.t}</div></div>
        <div class="side away rowin"><img src="${m.visitor.logo || ""}" alt=""><div class="n up">${label("away", m)}</div></div>
      </div><div class="ann-foot">${m.stadium || ""}</div></div></div>` };
  },

  rosters(m) {
    const col = side => {
      let list = team(side, m).roster || [];
      if (!list.length) list = m.season?.[side === "home" ? "home" : "visitor"]?.players || [];
      if (!list.length) return null;
      return th(side, m, false) + list.map(p => `<div class="pl rowin"><div class="j num">${p.jersey ?? ""}</div>
        <div class="nm">${nm2(p.name)}</div><div class="tg">${p.starter ? "ΠΕΝΤΑΔΑ" : ""}</div></div>`).join("");
    };
    const h = col("home"), a = col("away");
    return h || a ? { pos: "lower", html: `<div class="card " style="width:1560px">${hdr(m, "Δωδεκάδες")}${two(h, a)}</div>` } : null;
  },

  starters(m) {
    const col = side => {
      const five = (team(side, m).roster || []).filter(p => p.starter);
      return five.length ? th(side, m, false) + five.map(p =>
        `<div class="pl rowin"><div class="j num">${p.jersey ?? ""}</div><div class="nm">${nm2(p.name).replace("<b>", "<b class='up'>")}</div></div>`).join("") : null;
    };
    const h = col("home"), a = col("away");
    return h || a ? { pos: "lower", html: `<div class="card starters " style="width:1560px">${hdr(m, "Αρχικές πεντάδες")}${two(h, a)}</div>` } : null;
  },

  teamstats(m) {
    const H = m.home.totals, A = m.visitor.totals;
    if (!H || !A) return null;
    return { pos: "lower", html: compare(m, "Στατιστικά αγώνα", [
      ["Πόντοι", H.pts, A.pts], ...shooting(H, A),
      ["Ριμπάουντ", H.reb, A.reb], ["Επιθετικά ριμπάουντ", H.oreb, A.oreb], ["Ασίστ", H.ast, A.ast],
      ["Κλεψίματα", H.stl, A.stl], ["Κοψίματα", H.blk, A.blk],
      ["Λάθη", H.tov, A.tov, null, null, true], ["Φάουλ", H.pf, A.pf, null, null, true], ["PIR", H.pir, A.pir]]) };
  },

  comparison(m) {
    const H = m.season?.home?.team, A = m.season?.visitor?.team;
    if (!H || !A) return null;
    return { pos: "lower", html: compare(m, "Μέσοι όροι σεζόν", [
      ["Πόντοι", H.pts, A.pts], ...shooting(H, A, true), ["Ριμπάουντ", H.reb, A.reb], ["Ασίστ", H.ast, A.ast],
      ["Κλεψίματα", H.stl, A.stl], ["Κοψίματα", H.blk, A.blk], ["Λάθη", H.tov, A.tov, null, null, true], ["PIR", H.pir, A.pir]], false) };
  },

  boxscore(m) {
    const t = team(SIDE, m), P = t.players || [];
    if (!P.length) return null;
    const top = Math.max(...P.map(p => p.pts));
    const rows = P.map(p => `<tr class="rowin ${p.starter ? "st" : ""}"><td class="n num">${p.jersey ?? ""}</td><td class="l nm">${shortName(p.name)}</td>
      <td class="num">${p.min || ""}</td><td class="num b ${p.pts === top && top > 0 ? "hi" : ""}">${p.pts}</td>
      <td class="num">${ma(p.m2, p.a2)}</td><td class="num">${ma(p.m3, p.a3)}</td><td class="num">${ma(p.m1, p.a1)}</td>
      <td class="num">${p.reb}</td><td class="num">${p.ast}</td><td class="num">${p.stl}</td><td class="num">${p.blk}</td>
      <td class="num">${p.tov}</td><td class="num">${p.pf}</td><td class="num b">${p.pir}</td></tr>`).join("");
    const T = t.totals;
    const tot = T ? `<tr class="tot rowin"><td></td><td class="l">ΣΥΝΟΛΟ</td><td></td><td class="num">${T.pts}</td><td class="num">${ma(T.m2, T.a2)}</td>
      <td class="num">${ma(T.m3, T.a3)}</td><td class="num">${ma(T.m1, T.a1)}</td><td class="num">${T.reb}</td><td class="num">${T.ast}</td>
      <td class="num">${T.stl}</td><td class="num">${T.blk}</td><td class="num">${T.tov}</td><td class="num">${T.pf}</td><td class="num">${T.pir}</td></tr>` : "";
    return { pos: "lower", html: `<div class="card " style="width:1360px">${hdr(m, "Στατιστικά παικτών")}${th(SIDE, m)}
      <table class="t"><thead><tr><th>#</th><th class="l">ΠΑΙΚΤΗΣ</th><th>ΛΕΠ</th><th>ΠΟΝ</th><th>2Π</th><th>3Π</th><th>ΒΟΛ</th>
      <th>ΡΙΜ</th><th>ΑΣ</th><th>ΚΛ</th><th>ΚΟΨ</th><th>ΛΑΘ</th><th>ΦΑΟΥΛ</th><th>PIR</th></tr></thead><tbody>${rows}${tot}</tbody></table></div>` };
  },

  player(m) {
    const p = (team(SIDE, m).roster || []).find(x => String(x.jersey) === String(JERSEY));
    return p ? { pos: "lower", html: playerCard(p, SIDE, m) } : null;
  },

  mvp(m) {
    let p = m.mvp, side = "home";
    if (p) side = _n(p.team) && _n(p.team) === _n(m.visitor.name) ? "away" : "home";
    else {
      const all = [...(m.home.players || []).map(x => [x, "home"]), ...(m.visitor.players || []).map(x => [x, "away"])];
      if (!all.length) return null;
      [p, side] = all.reduce((b, c) => (c[0].pir > b[0].pir ? c : b));
    }
    return { pos: "lower", html: playerCard(p, side, m, "MVP ΑΓΩΝΑ") };
  },

  leaders(m) {
    const col = side => {
      const P = team(side, m).players || [];
      if (!P.length) return null;
      const best = k => P.reduce((b, p) => (p[k] > (b?.[k] ?? -1e9) ? p : b), null);
      return th(side, m) + [["ΠΟΝΤΟΙ", "pts"], ["ΡΙΜΠΑΟΥΝΤ", "reb"], ["ΑΣΙΣΤ", "ast"], ["ΚΛΕΨΙΜΑΤΑ", "stl"], ["PIR", "pir"]]
        .map(([l, k]) => { const p = best(k); return `<div class="lr rowin"><span>${l}</span><i><em>#${p.jersey}</em>${shortName(p.name)}</i><b class="num cu">${p[k]}</b></div>`; }).join("");
    };
    const h = col("home"), a = col("away");
    return h || a ? { pos: "lower", html: `<div class="card " style="width:1280px">${hdr(m, "Κορυφαίοι αγώνα")}${two(h, a)}</div>` } : null;
  },

  score(m) {
    const q = (m.quarters || []).filter(x => x.home_score != null);
    return { pos: "center", html: `<div class="card sc ">${hdr(m, m.competition || "", m.group || "")}<div class="row">
      <div class="t home"><img src="${m.home.logo || ""}" alt=""><div class="n up">${label("home", m)}</div></div>
      <div class="s num"><b class="cu">${m.home.score ?? 0}</b><b class="cu">${m.visitor.score ?? 0}</b></div>
      <div class="t away"><img src="${m.visitor.logo || ""}" alt=""><div class="n up">${label("away", m)}</div></div></div>
      <div class="foot"><span class="st up">${stateText(m)}</span>${q.map(x => `<span class="q num rowin"><span>${qLabel(x.period)}</span>${x.home_score}-${x.visitor_score}</span>`).join("")}</div></div>` };
  },

  referees(m, st) {
    const o = st || {};
    const refs = o.referees || [], rest = [
      ...(o.judges || []).map(p => [p.role || "ΚΡΙΤΗΣ", p.name]),
      ...(o.commissioners || []).map(p => [p.role || "ΚΟΜΙΣΑΡΙΟΣ", p.name]),
      ...(o.referee_coaches || []).map(p => [p.role || "ΠΑΡΑΤΗΡΗΤΗΣ", p.name]),
    ];
    if (!refs.length && !rest.length) return null;
    const ord = ["Α", "Β", "Γ"];
    return { pos: "lower", html: `<div class="card" style="width:1240px">${hdr(m, "Διαιτητές αγώνα", `${label("home", m)} – ${label("away", m)}`)}
      <div class="of">
        <div><h3>ΔΙΑΙΤΗΤΕΣ</h3>${refs.map((p, i) => `<div class="ref rowin"><div class="k">${ord[i] || i + 1}'</div><div class="v up">${p.name}</div></div>`).join("")}</div>
        <div><h3>ΚΡΙΤΕΣ &amp; ΤΕΧΝΙΚΟΙ ΕΚΠΡΟΣΩΠΟΙ</h3>${rest.map(([r, n]) => `<div class="ofr rowin"><span>${UP(r)}</span><b class="up">${n}</b></div>`).join("") || ""}</div>
      </div></div>` };
  },

  standings(m, st) {
    const groups = st?.groups || [];
    if (!groups.length) return null;
    const mine = r => [m.home.name, m.visitor.name].some(n => _n(n) && _n(r.team) === _n(n));
    const want = qs.get("group");
    const g = (want && groups.find(x => _n(x.name).includes(_n(want)))) || groups.find(x => x.rows.some(mine)) || groups[0];
    const has = k => g.rows.some(r => r[k] != null);
    const cols = [["played", "ΑΓ"], ["wins", "Ν"], ["losses", "Η"], ["pf", "ΥΠ"], ["pa", "ΚΑΤ"], ["diff", "+/-"], ["points", "ΒΑΘ"]].filter(([k]) => has(k));
    const rows = g.rows.slice(0, 16).map(r => `<tr class="rowin ${mine(r) ? "me" : ""}"><td class="n num">${r.pos}</td>
      <td class="l"><div class="tl">${r.logo ? `<img src="${r.logo}" alt="">` : ""}<span class="nm up">${r.team || ""}</span></div></td>
      ${cols.map(([k]) => `<td class="num ${k === "points" ? "b" : ""}">${k === "diff" && r[k] > 0 ? "+" : ""}${r[k] ?? ""}</td>`).join("")}</tr>`).join("");
    return { pos: "lower", html: `<div class="card " style="width:1160px">${hdr({ ...m, competition_logo: st.logo || m.competition_logo }, "Βαθμολογία", g.name || m.competition || "")}
      <table class="t"><thead><tr><th></th><th class="l">ΟΜΑΔΑ</th>${cols.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>` };
  },
};

/* best 4 stats: points always, then the three biggest of the rest (ties keep this order) */
const BAR_STATS = [["pts", "ΠΟΝΤΟΙ"], ["reb", "ΡΙΜΠΑΟΥΝΤ"], ["ast", "ΑΣΙΣΤ"], ["pir", "PIR"], ["stl", "ΚΛΕΨΙΜΑΤΑ"], ["blk", "ΚΟΨΙΜΑΤΑ"]];
function bestFour(p) {
  const want = (qs.get("stats") || "").split(",").filter(Boolean);
  if (want.length) return BAR_STATS.filter(([k]) => want.includes(k)).slice(0, 4);
  const [first, ...rest] = BAR_STATS;
  return [first, ...rest.map((s, i) => [s, i]).sort((a, b) => (p[b[0][0]] ?? 0) - (p[a[0][0]] ?? 0) || a[1] - b[1]).slice(0, 3).map(x => x[0])];
}
function playerBar(m, side, jersey) {
  const t = team(side, m), p = (t.roster || []).find(x => String(x.jersey) === String(jersey));
  if (!p) return "";
  const [fn, ln] = split(p.name);
  return `<div class="pb ${side}"><div class="pj num">${p.jersey ?? ""}</div>
    <div class="who"><img src="${t.logo || ""}" alt=""><div class="nm"><span class="up">${fn}</span><b class="up">${ln}</b></div></div>
    ${bestFour(p).map(([k, l], i) => `<div class="st num ${i === 0 ? "key" : ""}" style="--i:${i}"><b class="cu">${p[k] ?? 0}</b><span>${l}</span></div>`).join("")}</div>`;
}

function shooting(H, A, avg = false) {
  const v = (x, y) => (avg ? `${f1(x)}/${f1(y)}` : ma(x, y));
  return [["ΔΙΠΟΝΤΑ", "m2", "a2"], ["ΤΡΙΠΟΝΤΑ", "m3", "a3"], ["ΒΟΛΕΣ", "m1", "a1"]].map(([l, mk, ak]) => [
    l, pct(H[mk], H[ak]), pct(A[mk], A[ak]),
    `${v(H[mk], H[ak])}<em>${pct(H[mk], H[ak])}%</em>`, `<em>${pct(A[mk], A[ak])}%</em>${v(A[mk], A[ak])}`]);
}

function compare(m, title, rows, showScore = true) {
  const body = rows.map(([l, hv, av, hd, ad, lower]) => {
    const max = Math.max(hv, av, 1), hl = lower ? hv < av : hv > av, al = lower ? av < hv : av > hv;
    return `<div class="cr rowin"><div class="cv num ${hl ? "lead" : ""} ${hd ? "" : "cu"}">${hd ?? f1(hv)}</div>
      <div class="cm"><b>${UP(l)}</b><div class="bars"><span class="l"><i style="width:${Math.max(hv, 0) / max * 100}%"></i></span>
      <span class="r"><i style="width:${Math.max(av, 0) / max * 100}%"></i></span></div></div>
      <div class="cv a num ${al ? "lead" : ""} ${ad ? "" : "cu"}">${ad ?? f1(av)}</div></div>`;
  }).join("");
  return `<div class="card " style="width:1100px">${hdr(m, title)}<div class="vs">${th("home", m, showScore)}${th("away", m, showScore)}</div>${body}</div>`;
}

function playerCard(p, side, m, kicker) {
  const t = team(side, m), [fn, ln] = split(p.name);
  const chip = (v, l, cls = "") => `<div class="chip rowin ${cls}"><b class="num ${/^-?\d+$/.test(String(v)) ? "cu" : ""}">${v}</b><span>${l}</span></div>`;
  return `<div class="card pc ${side} "><div class="jn"><b class="num">${p.jersey ?? ""}</b><img src="${t.logo || ""}" alt=""></div><div class="bd">
    ${kicker ? `<div class="kick">${kicker}</div>` : ""}<div class="fn up">${fn}</div><div class="ln up">${ln}</div>
    <div class="tmn up">${label(side, m)}${p.min ? ` · ${p.min} ΛΕΠΤΑ` : ""}</div>
    <div class="chips">
      ${chip(p.pts, "ΠΟΝΤΟΙ", "hi")}${chip(p.reb, "ΡΙΜΠΑΟΥΝΤ")}${chip(p.ast, "ΑΣΙΣΤ")}${chip(p.stl, "ΚΛΕΨΙΜΑΤΑ")}${chip(p.pir, "PIR", "hi")}
      ${chip(ma(p.m2, p.a2), `ΔΙΠΟΝΤΑ ${pct(p.m2, p.a2)}%`, "sm")}${chip(ma(p.m3, p.a3), `ΤΡΙΠΟΝΤΑ ${pct(p.m3, p.a3)}%`, "sm")}
      ${chip(ma(p.m1, p.a1), `ΒΟΛΕΣ ${pct(p.m1, p.a1)}%`, "sm")}${chip(p.blk, "ΚΟΨΙΜΑΤΑ", "sm")}${chip(p.tov, "ΛΑΘΗ", "sm")}
    </div></div></div>`;
}

/* ---------- fit long names ---------- */
function fit() {
  stage.querySelectorAll(".n, .ln, .pb .nm b").forEach(el => {
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize), min = fs * 0.62;
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; }
  });
}

/* ---------- motion ---------- */
let lastHtml = "", shown = false, outroTimer = null, introTimer = null, prevPts = {};
const stage = $("stage");
function stagger() {
  stage.querySelectorAll(".rowin").forEach((el, i) => el.style.setProperty("--i", i));
  stage.querySelectorAll(".cr").forEach((el, i) => el.querySelectorAll(".bars i").forEach(b => b.style.setProperty("--i", i)));
}
function countUp() {
  stage.querySelectorAll(".cu").forEach(el => {
    const end = parseInt(el.textContent, 10);
    if (!Number.isFinite(end) || end === 0) return;
    const row = el.closest(".rowin"), i = row ? +getComputedStyle(row).getPropertyValue("--i") || 0 : 0;
    const delay = 1200 + i * 90, dur = 1000, t0 = performance.now() + delay;
    el.textContent = "0";
    const step = now => {
      const k = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function playIn() {
  clearTimeout(outroTimer); clearTimeout(introTimer);
  stage.classList.remove("outro", "intro"); void stage.offsetWidth;
  stage.classList.add("on", "intro"); stagger(); countUp();
  introTimer = setTimeout(() => stage.classList.remove("intro"), 1300 + stage.querySelectorAll(".rowin").length * 90 + 1200);
  if (HOLD) outroTimer = setTimeout(playOut, HOLD * 1000);
  shown = true;
}
function playOut() {
  stage.classList.remove("intro"); stage.classList.add("outro");
  setTimeout(() => stage.classList.remove("on", "outro"), 1000);
}
window.addEventListener("obsSourceVisibleChanged", e => { if (e.detail?.visible && lastHtml) playIn(); });
window.addEventListener("obsSourceActiveChanged", e => { if (e.detail?.active && lastHtml) playIn(); });

function flashScores() {
  stage.querySelectorAll(".sb .pts").forEach(el => {
    const k = el.dataset.k, v = el.textContent;
    if (prevPts[k] !== undefined && prevPts[k] !== v) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    prevPts[k] = v;
  });
}

async function tick() {
  try {
    if (!CARDS[TYPE]) throw new Error(`Άγνωστη κάρτα "${TYPE}". Διαθέσιμες: ${Object.keys(CARDS).join(", ")}`);
    const m = await MM.game(GAME, NEEDS_SEASON);
    const st = TYPE === "standings" ? await MM.standings(m).catch(() => null)
      : TYPE === "referees" ? await MM.officials(m).catch(() => null) : null;
    setColors(m);
    const out = CARDS[TYPE](m, st);
    if (!out) { if (qs.get("debug")) note("Δεν υπάρχουν ακόμα δεδομένα για αυτή την κάρτα"); return; }
    const html = out.raw ? out.html : `<div class="fx ${out.slab === false ? "noslab" : ""}">${out.html}</div>`;
    if (html !== lastHtml) {
      const inIntro = stage.classList.contains("intro");
      stage.className = ["lower", "center", "half", "full", "board"].reduce((c, k) => c.replace(k, ""), stage.className).trim();
      stage.classList.add(out.pos);
      stage.innerHTML = html;
      lastHtml = html;
      fit();
      if (!shown) playIn(); else if (inIntro) stagger();
    }
    if (out.sb) flashScores();
    $("note").hidden = true;
  } catch (e) { note(e.message); }
}
function note(t) { $("note").textContent = t; $("note").hidden = false; }
tick();
setInterval(tick, POLL);
</script>

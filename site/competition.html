<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National MatchCenter · Διοργάνωση</title>
<link rel="stylesheet" href="assets/style.css?v=1">
<style>
.calbox{display:grid;grid-template-columns:auto 1fr minmax(260px,360px);gap:18px;align-items:center;margin:28px 0 60px;padding:22px 24px;
  background:linear-gradient(135deg,var(--bg-3),var(--bg-2));border:1px solid var(--edge);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.calbox:empty{display:none}
.cal-ic{width:54px;height:54px;display:grid;place-items:center;background:var(--accent);color:#fff;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cal-tx h3{margin:0 0 4px;font-size:20px;font-weight:900;font-stretch:72%;letter-spacing:.3px}
.cal-tx p{margin:0;color:var(--muted);font-size:14px}
.cal-ac{display:flex;flex-direction:column;gap:8px}
.cal-ac select{height:40px;padding:0 12px;background:var(--bg);color:var(--text);border:1px solid var(--edge);border-radius:4px;font:inherit;font-weight:700}
.cal-bt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cal-bt a{height:38px;display:grid;place-items:center;border-radius:4px;font-weight:800;font-size:14px;background:var(--bg);border:1px solid var(--line);color:var(--muted);pointer-events:none;opacity:.5;transition:.15s}
.calbox.on .cal-bt a{pointer-events:auto;opacity:1;color:#fff;background:var(--accent);border-color:var(--accent)}
.calbox.on .cal-bt a:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:var(--bg)}
.cal-dl{font-size:13px;color:var(--muted);text-align:center;visibility:hidden}
.calbox.on .cal-dl{visibility:visible}
.cal-dl:hover{color:var(--accent-hi)}
@media (max-width:820px){.calbox{grid-template-columns:auto 1fr}.cal-ac{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <a class="back" href="competitions.html">‹ Όλες οι διοργανώσεις</a>
  <div class="comphead" id="head"></div>
  <div class="grouptabs" id="groups"></div>
  <div id="body"><div class="loading">Φόρτωση αγώνων και βαθμολογίας…</div></div>
  <section class="calbox" id="cal"></section>
</main>
<footer>Δεδομένα: Mismatch GameDay · ΕΟΚ · Ανεπίσημη ιστοσελίδα</footer>
<script src="assets/config.js?v=1"></script>
<script src="assets/common.js?v=1"></script>
<script>
header("", "comp");
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const CH = P.get("ch");
let D = null, G = P.get("group") || "";

const isYouth = n => /ΕΦΗΒ|ΝΕΑΝΙΔ|ΠΑΙΔ|ΚΟΡΑΣΙΔ/.test(UP(n));   // no MVP for youth championships
let MD = null;   // index of the matchday on screen
let VIEW = new URLSearchParams(location.search).get("view") || "games";   // games | mvp
const MVPC = {};
let YOUTH = false;

function currentMatchday(mds) {
  const today = new Date().toLocaleDateString("en-CA", tz);
  let i = mds.findIndex(md => md.games.some(x => isLive(x.state) ||
    (!isFinal(x.state) && (x.date ? new Date(x.date).toLocaleDateString("en-CA", tz) : "") >= today)));
  return i < 0 ? mds.length - 1 : i;          // season over → last matchday
}

function render() {
  const groups = D.groups || [];
  if (!groups.length) { $("body").innerHTML = `<div class="empty">Δεν υπάρχουν αγώνες σε αυτή τη διοργάνωση.</div>`; return; }
  if (!groups.some(g => g.name === G)) G = groups[0].name;
  $("groups").innerHTML = groups.length > 1 ? groups.map(g =>
    `<button class="${g.name === G ? "on" : ""}" data-g="${esc(g.name)}">${esc(g.name)}</button>`).join("") : "";
  if (YOUTH) VIEW = "games";
  const g = groups.find(x => x.name === G);
  const mds = g.matchdays.map(md => ({ ...md, first: md.games[0]?.date || "" }));
  if (MD === null || MD >= mds.length) MD = currentMatchday(mds);
  history.replaceState(null, "", `?ch=${encodeURIComponent(CH)}&group=${encodeURIComponent(G)}&md=${MD}&view=${VIEW}`);
  const md = mds[MD];

  $("body").innerHTML = `<div class="two-col">
    <div><h3 class="sec-h">ΒΑΘΜΟΛΟΓΙΑ${g.name ? " · " + esc(UP(g.name)) : ""}</h3>
      ${standingsTable(g.standings, [], g.source === "computed" ? "Υπολογισμένη από τα αποτελέσματα (νίκη 2, ήττα 1)." : "", true)}</div>
    <div>${YOUTH ? "" : `<div class="viewtabs"><button data-view="games" class="${VIEW === "games" ? "on" : ""}">ΑΓΩΝΕΣ</button>
        <button data-view="mvp" class="${VIEW === "mvp" ? "on" : ""}">MVP</button></div>`}
      <div class="mdnav">
        <button class="btn" data-step="-1" ${MD <= 0 ? "disabled" : ""} aria-label="Προηγούμενη αγωνιστική">‹</button>
        <select class="in" id="mdsel">${mds.map((x, i) => `<option value="${i}" ${i === MD ? "selected" : ""}>${esc(x.name)}${x.first ? " · " + esc(shortDate(x.first)) : ""}</option>`).join("")}</select>
        <button class="btn" data-step="1" ${MD >= mds.length - 1 ? "disabled" : ""} aria-label="Επόμενη αγωνιστική">›</button>
      </div>
      ${VIEW === "mvp" ? `<div id="mvpbox"><div class="loading">Φόρτωση MVP…</div></div>`
        : `<div class="mdgrid">${md.games.map(x => gameBox(x, isLive(x.state) || isFinal(x.state) ? shortDate(x.date) : `${shortDate(x.date)} · ${hhmm(x.date)}`)).join("")}</div>`}
    </div></div>`;
  if (VIEW === "mvp") loadMvp(G, md.name);
}

async function loadMvp(group, mdName) {
  const key = `${group}|${mdName}`;
  try {
    if (!MVPC[key]) MVPC[key] = (await api("mvps", { ch: CH, group, md: mdName })).mvps || [];
    const box = $("mvpbox");
    if (box && `${G}|${D.groups.find(x => x.name === G).matchdays[MD].name}` === key) box.innerHTML = mvpList(MVPC[key], true);
  } catch (e) { const box = $("mvpbox"); if (box) box.innerHTML = `<div class="empty">Σφάλμα φόρτωσης (${esc(e.message)}).</div>`; }
}

$("groups").onclick = e => { const g = e.target.dataset.g; if (g) { G = g; MD = null; render(); } };
$("body").onclick = e => {
  const s = e.target.dataset.step, v = e.target.dataset.view;
  if (s) { MD += +s; render(); }
  if (v && v !== VIEW) { VIEW = v; render(); }
};
$("body").onchange = e => { if (e.target.id === "mdsel") { MD = +e.target.value; render(); } };

function calBox() {
  const names = new Set();
  (D.groups || []).forEach(g => (g.matchdays || []).forEach(m => (m.games || []).forEach(x => {
    if (x.home && x.home.name) names.add(x.home.name);
    if (x.away && x.away.name) names.add(x.away.name);
  })));
  const list = [...names].sort((a, b) => a.localeCompare(b, "el"));
  if (!list.length) return;
  $("cal").innerHTML = `
    <div class="cal-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
    <div class="cal-tx"><h3 class="up">Το πρόγραμμα της ομάδας σου στο κινητό</h3>
      <p>Επίλεξε ομάδα και πρόσθεσέ την στο ημερολόγιό σου. Οι αγώνες ενημερώνονται αυτόματα (ώρες, γήπεδα, αποτελέσματα).</p></div>
    <div class="cal-ac">
      <select id="calteam"><option value="">Επίλεξε ομάδα…</option>${list.map(n => `<option>${esc(n)}</option>`).join("")}</select>
      <div class="cal-bt">
        <a id="calg" target="_blank" rel="noopener">Google Calendar</a>
        <a id="calw">iPhone / Outlook</a>
      </div>
      <a id="cald" class="cal-dl">ή κατέβασε αρχείο .ics</a>
    </div>`;
  const upd = () => {
    const t = $("calteam").value, on = !!t;
    $("cal").classList.toggle("on", on);
    if (!on) return;
    const feed = apiUrl("ics", { ch: CH, team: t });
    const web = feed.replace(/^https?:/, "webcal:");
    $("calg").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(web);
    $("calw").href = web;
    $("cald").href = feed;
  };
  $("calteam").onchange = upd;
}

if (!CH) location.href = "competitions.html";
api("channel", { ch: CH }).then(d => {
  D = d;
  const c = d.channel || {};
  YOUTH = isYouth(c.name);
  document.title = `National MatchCenter · ${c.name || ""}`;
  $("head").innerHTML = `${c.logo ? `<img src="${esc(c.logo)}" alt="">` : ""}<div><h1 class="up">${esc(c.name || "")}</h1><span>${d.count} αγώνες</span></div>`;
  if (P.get("md") !== null && P.get("group")) MD = +P.get("md");
  calBox();
  render();
}).catch(e => { $("body").innerHTML = `<div class="empty">Σφάλμα φόρτωσης (${esc(e.message)}).</div>`; });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National MatchCenter · Ticker</title>
<link rel="stylesheet" href="assets/style.css?v=1">
<style>
  /* light theme (?theme=light): white background, light cards. Default is dark */
  html.light{--bg:#FFFFFF;--bg-2:#F4F6F9;--bg-3:#E7EBF1;--line:rgba(14,26,43,.10);--edge:rgba(255,255,255,0);--text:#0E1A2B;--muted:#64748B}
  html.light .card{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  html.light .card:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  html.light .badge.fin{background:#E7EBF1;color:#0E1A2B}
  html.light .day{background:#fff}
  html.light .day.on{background:var(--accent)}

  /* self-contained strip: dates on top, game cards below, both scroll sideways */
  html,body{background:var(--bg)}
  html.embed,html.embed body{background:transparent}
  .tk{display:flex;flex-direction:column;gap:8px;padding:10px 12px;max-width:100%;overflow:hidden}
  .row{position:relative;display:flex;align-items:center}
  .scroller{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px}
  .scroller::-webkit-scrollbar{display:none}
  .arrow{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg-2);color:var(--text);
    font:inherit;font-weight:900;cursor:pointer;border-radius:4px;margin:0 4px}
  .arrow:hover{border-color:var(--accent)}
  @media (hover:none){ .arrow{display:none} }

  /* dates */
  .day{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:62px;height:58px;padding:0 6px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);
    font:inherit;cursor:pointer;border-radius:4px;transition:background .2s,color .2s,transform .2s}
  .day:hover{color:var(--text);transform:translateY(-1px)}
  .day .wd{font-size:11px;font-weight:800;letter-spacing:.4px}
  .day .dn{font-size:22px;font-weight:900;line-height:1;color:var(--text);font-stretch:75%}
  .day .ct{font-size:10px;font-weight:700;min-height:12px}
  .day.today .wd{color:var(--accent-hi)}
  .day.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .day.on .dn,.day.on .wd{color:#fff}
  .day.empty .dn{opacity:.45}

  /* game cards */
  .games{min-height:126px}
  .card{flex:none;scroll-snap-align:start;width:236px;display:block;background:linear-gradient(180deg,var(--bg-2),var(--bg));
    box-shadow:inset 0 1px 0 var(--edge);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    animation:cardIn .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms);transition:transform .18s}
  .card:hover{transform:translateY(-2px)}
  .still .card{animation:none}
  @keyframes cardIn{from{opacity:0;transform:translateX(18px)}}
  .games.still .card{animation:none}
  .card .hd{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
  .card .hd .c{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .badge{height:18px;font-size:10px;padding:0 6px}
  .card .tm{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;height:40px;padding:0 10px}
  .card .tm + .tm{border-top:1px solid var(--line)}
  .card .tm img{width:22px;height:22px}
  .card .tm .n{font-size:13px;font-weight:700;font-stretch:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tm .s{font-size:19px;font-weight:900;min-width:26px;text-align:right}
  .card .tm.lose .n,.card .tm.lose .s{color:var(--muted);font-weight:600}
  .msg{display:flex;align-items:center;justify-content:center;width:100%;height:120px;color:var(--muted);font-weight:600}
  .skel{flex:none;width:236px;height:118px;background:linear-gradient(90deg,var(--bg-2) 0,var(--bg-3) 50%,var(--bg-2) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="tk">
  <div class="row"><button class="arrow" data-s="days" data-d="-1" aria-label="Προηγούμενες ημέρες">‹</button>
    <div class="scroller" id="days"></div>
    <button class="arrow" data-s="days" data-d="1" aria-label="Επόμενες ημέρες">›</button></div>
  <div class="row"><button class="arrow" data-s="games" data-d="-1" aria-label="Προηγούμενοι αγώνες">‹</button>
    <div class="scroller games" id="games"></div>
    <button class="arrow" data-s="games" data-d="1" aria-label="Επόμενοι αγώνες">›</button></div>
</div>

<script src="assets/config.js?v=1"></script>
<script src="assets/common.js?v=1"></script>
<script>
/* Options: ?back=7&ahead=14  (days before/after today)  ·  ?embed=1 (transparent, for an iframe)  ·  ?theme=light (white)
            ?comp=ΕΦΗΒΩΝ (only one competition)        ·  ?target=_self (open game in the same frame) */
const P = new URLSearchParams(location.search);
const BACK = Math.min(14, +P.get("back") || 7), AHEAD = Math.min(21, +P.get("ahead") || 14);
const COMP = P.get("comp") || "", TARGET = P.get("target") || "_top";
if (P.get("embed")) document.documentElement.classList.add("embed");
if (P.get("theme") === "light") {
  document.documentElement.classList.add("light");
  document.documentElement.style.setProperty("--accent-hi", S.accent || "#1D4ED8");   // readable on white
}
const $ = id => document.getElementById(id);
// links must work from inside an iframe on another page
const BASE = new URL(".", location.href).href;

const today = todayISO();
const days = Array.from({ length: BACK + AHEAD + 1 }, (_, i) => addDays(today, i - BACK));
let sel = P.get("date") && days.includes(P.get("date")) ? P.get("date") : today;
const cache = {};

function dayChip(d) {
  const dt = new Date(d + "T12:00:00Z");
  const wd = d === today ? "ΣΗΜΕΡΑ" : UP(dt.toLocaleDateString("el-GR", { weekday: "short", timeZone: "UTC" }));
  const mo = UP(dt.toLocaleDateString("el-GR", { month: "short", timeZone: "UTC" }));
  const n = cache[d] ? cache[d].length : null;
  return `<button class="day ${d === sel ? "on" : ""} ${d === today ? "today" : ""} ${n === 0 ? "empty" : ""}" data-d="${d}">
    <span class="wd">${wd}</span><span class="dn num">${dt.getUTCDate()}</span>
    <span class="ct">${n == null ? mo : n ? `${n} ${n === 1 ? "αγώνας" : "αγώνες"}` : "—"}</span></button>`;
}
function renderDays(center = false) {
  $("days").innerHTML = days.map(dayChip).join("");
  if (center) $("days").querySelector(".day.on")?.scrollIntoView({ inline: "center", block: "nearest" });
}

function card(g, i) {
  const hs = g.home.score, as = g.away.score, done = isFinal(g.state);
  const lose = s => done && hs != null && as != null && ((s === "h" && hs < as) || (s === "a" && as < hs)) ? "lose" : "";
  return `<a class="card" style="--i:${i}" target="${TARGET}" href="${BASE}game.html?id=${encodeURIComponent(g.id)}">
    <div class="hd"><span class="c up">${esc(g.competition || "")}${g.group ? " · " + esc(g.group) : ""}</span>${liveLabel(g)}</div>
    <div class="tm ${lose("h")}"><img src="${esc(g.home.logo || "")}" alt="" loading="lazy"><div class="n up">${esc(g.home.name)}</div><div class="s num">${hs ?? ""}</div></div>
    <div class="tm ${lose("a")}"><img src="${esc(g.away.logo || "")}" alt="" loading="lazy"><div class="n up">${esc(g.away.name)}</div><div class="s num">${as ?? ""}</div></div></a>`;
}
function renderGames(quiet = false) {
  $("games").classList.toggle("still", quiet);
  const list = cache[sel];
  if (!list) { $("games").innerHTML = Array(5).fill(`<div class="skel"></div>`).join(""); return; }
  // live first, then by time
  const order = g => (isLive(g.state) ? 0 : 1);
  const gs = [...list].sort((a, b) => order(a) - order(b) || (a.date || "").localeCompare(b.date || ""));
  $("games").innerHTML = gs.length ? gs.map(card).join("") : `<div class="msg">Δεν υπάρχουν αγώνες αυτή την ημέρα.</div>`;
  $("games").scrollLeft = 0;
}

async function loadDay(d, force = false) {
  if (cache[d] && !force) return cache[d];
  const r = await api("day", { date: d });
  cache[d] = (r.games || []).filter(g => allowComp(g.competition) && (!COMP || UP(g.competition).includes(UP(COMP))));
  return cache[d];
}

async function select(d) {
  sel = d; $("games").classList.remove("still"); renderDays(); renderGames();
  try { await loadDay(d); } catch { cache[d] = cache[d] || []; }
  if (sel === d) { renderDays(); renderGames(); }
}

// counts for the other days, quietly, one at a time (nearest days first)
async function prefetch() {
  const rest = days.filter(d => d !== sel).sort((a, b) => Math.abs(new Date(a) - new Date(today)) - Math.abs(new Date(b) - new Date(today)));
  for (const d of rest) { try { await loadDay(d); renderDays(); } catch {} await new Promise(r => setTimeout(r, 250)); }
}

$("days").onclick = e => { const b = e.target.closest(".day"); if (b && b.dataset.d !== sel) select(b.dataset.d); };
document.querySelectorAll(".arrow").forEach(a => a.onclick = () => {
  const s = $(a.dataset.s); s.scrollBy({ left: +a.dataset.d * s.clientWidth * 0.8, behavior: "smooth" });
});

renderDays(true);
select(sel).then(prefetch);
// keep today fresh (live scores)
setInterval(async () => {
  if (sel !== today) return;
  try { await loadDay(today, true); renderDays(); $("games").classList.add("still"); const x = $("games").scrollLeft; renderGames(true); $("games").scrollLeft = x; } catch {}
}, (S.refreshSeconds || 30) * 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National MatchCenter · Ομάδες</title>
<link rel="stylesheet" href="assets/style.css?v=1">
<style>
  .sbox{position:relative;margin:16px 0 6px}
  .sbox input{width:100%;height:52px;padding:0 16px 0 46px;font-size:18px;max-width:none}
  .sbox svg{position:absolute;left:14px;top:15px;width:22px;height:22px;fill:var(--muted)}
  .stat{color:var(--muted);font-size:13px;font-weight:700;margin:6px 0 14px}
  .tres{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:60px}
  .tres .ccard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tres .ccard div{min-width:0}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <div class="dayhead"><h1>Ομάδες</h1></div>
  <div class="sbox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input class="in" id="q" placeholder="Αναζήτηση ομάδας…" autocomplete="off">
  </div>
  <div class="stat" id="stat"></div>
  <div class="tres" id="res"><div class="loading">Φόρτωση ομάδων…</div></div>
</main>
<footer>Δεδομένα: Mismatch GameDay</footer>
<script src="assets/config.js?v=1"></script>
<script src="assets/common.js?v=1"></script>
<script>
header("", "team");
const $ = id => document.getElementById(id);
let T = [];
function render() {
  const q = UP($("q").value.trim());
  history.replaceState(null, "", q ? `?q=${encodeURIComponent($("q").value.trim())}` : location.pathname);
  const L = T.filter(t => !q || UP(t.name).includes(q));
  $("stat").textContent = `${L.length} ομάδες`;
  $("res").innerHTML = L.map(t => `<a class="ccard" href="${teamUrl(t.key)}">${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
      <div><b class="up">${esc(t.name)}</b><span class="up">${esc(t.comps.join(" · "))}</span></div></a>`).join("")
    || `<div class="empty" style="grid-column:1/-1">Δεν βρέθηκαν ομάδες.</div>`;
}
$("q").value = new URLSearchParams(location.search).get("q") || "";
$("q").oninput = render;
api("teams").then(d => { T = d.teams || []; render(); })
  .catch(e => { $("res").innerHTML = `<div class="empty">Σφάλμα φόρτωσης (${esc(e.message)}).</div>`; });
</script>
</body>
</html>

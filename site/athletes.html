<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>National MatchCenter · Αθλητές</title>
<link rel="stylesheet" href="assets/style.css?v=1">
<style>
  .sbox{position:relative;margin:16px 0 6px}
  .sbox input{width:100%;height:52px;padding:0 16px 0 46px;font-size:18px;max-width:none}
  .sbox svg{position:absolute;left:14px;top:15px;width:22px;height:22px;fill:var(--muted)}
  .stat{color:var(--muted);font-size:13px;font-weight:700;margin:6px 0 14px}
  .ares{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:60px}
  .ath{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 14px;background:var(--bg-2);
       box-shadow:inset 0 1px 0 var(--edge);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
       transition:transform .15s}
  .ath:hover{transform:translateY(-2px);background:var(--bg-3)}
  .ath .nm{font-size:17px;font-weight:900;font-stretch:74%;line-height:1.1}
  .ath .tm{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;font-weight:700;min-width:0}
  .ath .tm img{width:20px;height:20px;flex:none}
  .ath .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ath .cp{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ath mark{background:none;color:var(--accent-hi)}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <div class="dayhead"><h1>Αθλητές</h1></div>
  <div class="sbox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input class="in" id="q" placeholder="Αναζήτηση αθλητή (όνομα ή επώνυμο)…" autocomplete="off" autofocus>
  </div>
  <div class="stat" id="stat"></div>
  <div class="ares" id="res"></div>
</main>
<footer>Δεδομένα: Mismatch GameDay · αθλητές που έχουν αγωνιστεί αυτή τη σεζόν</footer>

<script src="assets/config.js?v=1"></script>
<script src="assets/common.js?v=1"></script>
<script>
header("", "ath");
const $ = id => document.getElementById(id);
let timer = null, seq = 0, building = false;

const hl = (text, q) => {
  let out = esc(text);
  UP(q).split(/\s+/).filter(Boolean).forEach(w => {
    const i = UP(text).indexOf(w);
    if (i >= 0) out = esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + w.length))}</mark>` + esc(text.slice(i + w.length));
  });
  return out;
};

async function search() {
  const q = $("q").value.trim(), my = ++seq;
  history.replaceState(null, "", q ? `?q=${encodeURIComponent(q)}` : location.pathname);
  try {
    const d = await api("search", { q });
    if (my !== seq) return;
    $("stat").textContent = `${d.players} αθλητές στο ευρετήριο${d.pending ? ` · ενημερώνεται (${d.pending} αγώνες ακόμα)…` : ""}`;
    const R = d.results || [];
    $("res").innerHTML = q.length < 2 ? `<div class="empty" style="grid-column:1/-1">Γράψτε τουλάχιστον 2 γράμματα.</div>`
      : R.map(p => `<a class="ath" href="${playerUrl(p.pid, p.game)}">${photoOr(p.pid, p.jersey, "var(--bg-3)", 56)}
          <div style="min-width:0"><div class="nm up">${hl(p.name, q)}</div>
            <div class="tm">${p.logo ? `<img src="${esc(p.logo)}" alt="" loading="lazy">` : ""}<span class="up">${esc(p.team)}</span></div>
            <div class="cp up">${esc(p.comp || "")} · ${p.games} ${p.games === 1 ? "αγώνας" : "αγώνες"}</div></div></a>`).join("")
        || `<div class="empty" style="grid-column:1/-1">Δεν βρέθηκαν αθλητές${d.pending ? " ακόμα — το ευρετήριο ενημερώνεται" : ""}.</div>`;
    // keep building the index in the background (first visit of the season)
    if (d.pending && !building) { building = true; setTimeout(() => { building = false; search(); }, 1200); }
  } catch (e) { $("stat").textContent = `Σφάλμα (${e.message})`; }
}

$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 300); });
$("q").value = new URLSearchParams(location.search).get("q") || "";
search();
</script>
</body>
</html>

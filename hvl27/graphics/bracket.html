<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>League Cup bracket</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/teams-el.js"></script>
<script src="../js/cupbracket.js"></script>
<style>
  /* Πορεία League Cup, full screen 1920×1080. Structure from site/data/cup.txt (edit it: dates, courts, scores);
     scores missing in the file come from the Worker's League Cup games. Refreshes every 60 s.
     ?title=… own title · ?logo=leaguecup (default) | 0 · ?refresh=60 · ?noanim=1 */
  #bw { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: var(--font, Averta, 'Saira', sans-serif); --aqua: #99f5fd; --ink: #242c3b; --slate2: #2f394b; --cut: 16px;
        background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000' preserveAspectRatio='none'><defs><linearGradient id='t' x1='0' x2='0' y1='0' y2='1'><stop offset='0' stop-color='%23e9feff'/><stop offset='.35' stop-color='%2399f5fd'/><stop offset='1' stop-color='%23173c4c'/></linearGradient><linearGradient id='f' x1='0' x2='1'><stop offset='0' stop-color='%23fff' stop-opacity='0'/><stop offset='.2' stop-color='%23fff' stop-opacity='1'/><stop offset='.8' stop-color='%23fff' stop-opacity='1'/><stop offset='1' stop-color='%23fff' stop-opacity='0'/></linearGradient><mask id='m'><rect width='1000' height='1000' fill='url(%23f)'/></mask><filter id='g' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='9'/></filter><filter id='s' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='5'/></filter></defs><g fill='none' stroke-linecap='round' mask='url(%23m)'><path d='M-100 830 C 250 570 620 990 1100 650' transform='translate(0 14)' stroke='%23000' stroke-width='22' opacity='.35' filter='url(%23s)'/><path d='M-100 830 C 250 570 620 990 1100 650' stroke='%2399f5fd' stroke-width='66' opacity='0.090' filter='url(%23g)'/><path d='M-100 830 C 250 570 620 990 1100 650' stroke='url(%23t)' stroke-width='22' opacity='0.20'/><path d='M-100 830 C 250 570 620 990 1100 650' transform='translate(0 -4.8)' stroke='%23fff' stroke-width='4' opacity='0.40'/><path d='M-120 290 C 300 80 600 410 1120 150' transform='translate(0 14)' stroke='%23000' stroke-width='30' opacity='.35' filter='url(%23s)'/><path d='M-120 290 C 300 80 600 410 1120 150' stroke='%2399f5fd' stroke-width='90' opacity='0.068' filter='url(%23g)'/><path d='M-120 290 C 300 80 600 410 1120 150' stroke='url(%23t)' stroke-width='30' opacity='0.15'/><path d='M-120 290 C 300 80 600 410 1120 150' transform='translate(0 -6.6)' stroke='%23fff' stroke-width='5' opacity='0.30'/><path d='M180 1100 C 380 760 760 770 1100 430' transform='translate(0 14)' stroke='%23000' stroke-width='16' opacity='.35' filter='url(%23s)'/><path d='M180 1100 C 380 760 760 770 1100 430' stroke='%2399f5fd' stroke-width='48' opacity='0.077' filter='url(%23g)'/><path d='M180 1100 C 380 760 760 770 1100 430' stroke='url(%23t)' stroke-width='16' opacity='0.17'/><path d='M180 1100 C 380 760 760 770 1100 430' transform='translate(0 -3.5)' stroke='%23fff' stroke-width='3' opacity='0.34'/></g></svg>") center / 100% 100% no-repeat, radial-gradient(1400px 800px at 85% 8%, rgba(153,245,253,.12), transparent 60%), #0c1323 url('../img/bg-novi.jpg') center / cover no-repeat; }
  .par { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  #bw .lg { position: absolute; left: 60px; top: 40px; height: 170px; width: auto; filter: drop-shadow(0 6px 22px rgba(153,245,253,.4)); }
  #bw .hd { position: absolute; left: 0; right: 0; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; filter: drop-shadow(12px 9px 0 rgba(153,245,253,.28)); }
  #bw .tt { height: 92px; padding: 0 90px; display: grid; place-items: center; background: linear-gradient(100deg, #ffffff 0%, #d4f9fc 60%, var(--aqua) 100%); color: var(--ink);
            font-weight: 900; font-style: italic; font-size: 58px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; --cut: 26px; }
  #bw .st { height: 46px; padding: 0 60px; display: grid; place-items: center; background: linear-gradient(100deg, var(--aqua), #c6f6fa); color: var(--ink);
            font-weight: 800; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; --cut: 16px; }
  #bw .bk .bc { background: linear-gradient(120deg, rgba(36,44,59,.97) 0%, rgba(30,52,66,.95) 60%, rgba(22,68,82,.9) 100%); box-shadow: inset 5px 0 0 var(--aqua);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  #bw .bk .bc.fin { box-shadow: inset 5px 0 0 #fff, 0 0 30px rgba(153,245,253,.25); }
  #bw .bk .bh { color: #fff; border-bottom-color: var(--aqua); }
  .bk .bt .lo2 .logo { width: 100%; height: 100%; }
  .bk .bh { position: absolute; height: 40px; display: grid; place-items: center; font-weight: 900; font-size: 19px; letter-spacing: 1px; white-space: nowrap; color: var(--aqua); border-bottom: 2px solid rgba(153,245,253,.35); }
  .bk .bc { position: absolute; display: grid; grid-template-rows: 1fr 1fr; background: linear-gradient(100deg, rgba(52,63,84,.95), rgba(24,30,42,.95)); box-shadow: inset 0 -3px 0 var(--aqua); --cut: 16px; }
  .bk .bt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 16px 0 20px; min-width: 0; }
  .bk .bt + .bt { border-top: 1px solid rgba(255,255,255,.1); }
  .bk .bt .lo2 { width: 40px; height: 40px; display: grid; place-items: center; } .bk .bt .lo2 img { width: 100%; height: 100%; object-fit: contain; }
  .bk .bt span { font-weight: 800; font-size: 19px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .bk .bt b { font-weight: 900; font-size: 22px; white-space: nowrap; font-variant-numeric: tabular-nums; } .bk .bt b i { font-style: normal; opacity: .4; margin: 0 6px; }
  .bk .bt.l { opacity: .5; } .bk .bt.w b { color: var(--aqua); }
  .bk .bt.tbd span { opacity: .45; }
  .bk .bcap { position: absolute; text-align: center; font-weight: 800; font-size: 15px; letter-spacing: .5px; color: rgba(153,245,253,.85); white-space: nowrap; overflow: hidden; }
  .bk .bc.fin { box-shadow: inset 0 -3px 0 #fff, 0 0 30px rgba(153,245,253,.25); }
  .bk .bt.tbd span { font-size: 14px; letter-spacing: .3px; }
  .bk .bl { position: absolute; height: 2px; background: rgba(153,245,253,.55); } .bk .bl.v { width: 2px; height: auto; }
  .bk .bchamp { position: absolute; display: grid; place-items: center; gap: 4px; padding: 14px; text-align: center; font-weight: 800; font-size: 18px; letter-spacing: 3px; color: var(--aqua); }
  .bk .bchamp b { font-size: 30px; letter-spacing: 0; color: #fff; text-transform: uppercase; }
  /* entrance */
  #bw.go .hd { animation: bIn .7s cubic-bezier(.16, 1, .3, 1) both; }
  #bw.go .bk .bc, #bw.go .bk .bh, #bw.go .bk .bcap { animation: bIn .6s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(.15s + var(--d, 0) * .08s); }
  #bw.go .bk .bl { animation: bFade .8s ease both; animation-delay: .6s; }
  @keyframes bIn { from { opacity: 0; transform: translateY(18px); } }
  @keyframes bFade { from { opacity: 0; } }
  .noanim #bw * { animation: none !important; }
</style>
</head><body>
<div id="stage"><div id="bw"></div></div>
<script>
const BW = HVL.$('#bw');
const LG = HVL.get('logo', 'leaguecup');
async function draw(first) {
  let M;
  try { M = await CUPB.load('../data/cup.txt'); } catch (e) { return HVL.msg('⚠ data/cup.txt: ' + e.message); }
  let wm = [];
  if (!HVL.demo) try { HVL.league = 'cup'; wm = (await HVL.load('matches')).matches || []; } catch { wm = []; }
  CUPB.scores(M, wm);
  const body = CUPB.html(M, { W: 1920, top: 250, bottom: 1040, gapX: 70, pad: 70, cardMax: 128, capH: 24 }, (t) => HVL.logo({ name: t.name }));
  BW.innerHTML = `${LG !== '0' ? `<img class="lg" src="../logos/${/\.(png|jpe?g|webp|svg)$/i.test(LG) ? LG : LG + '.png'}" onerror="this.remove()">` : ''}
    <div class="hd"><div class="tt par">${HVL.esc(HVL.get('title') || 'ΠΟΡΕΙΑ ΚΥΠΕΛΛΟΥ')}</div><div class="st par">${HVL.esc(window.HVL_COMPETITIONS_EL?.cup || 'NOVIBET LEAGUE CUP')}</div></div>${body}`;
  BW.querySelectorAll('.bk .bc, .bk .bh, .bk .bcap').forEach((e, i) => e.style.setProperty('--d', i % 12));
  HVL.fit(BW);
  if (first) BW.classList.add('go'); else BW.classList.remove('go');
}
draw(true);
setInterval(() => draw(false), (+HVL.get('refresh', 60) || 60) * 1000);
</script>
</body></html>

<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Static background + logo</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* Full-screen Novibet background with one logo in the middle.
     ?logo=org (default, site/logos/org.png) | champ (site/logos/champ.png) | <file name in logos/> | https://…
     ?size=46 (logo height in % of the screen) · ?noanim=1 */
  #st { position: absolute; inset: 0; overflow: hidden; background: #0c1323 url('../img/bg-novi.jpg') center / cover no-repeat; }
  #st::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(12,19,35,0) 30%, rgba(12,19,35,.55) 100%); }
  #st .beam { position: absolute; top: -10%; height: 120%; width: 3px; background: linear-gradient(180deg, transparent, #99f5fd 30%, #fff 50%, #99f5fd 70%, transparent);
              transform: rotate(18deg); opacity: .35; box-shadow: 0 0 16px 3px rgba(153,245,253,.4); }
  #st img { position: absolute; left: 50%; top: 50%; height: var(--h, 46vh); max-width: 70vw; width: auto; object-fit: contain; z-index: 2;
            transform: translate(-50%, -50%); filter: drop-shadow(0 10px 40px rgba(0,0,0,.45)); }
  #st.go img { animation: stIn 1s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes stIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.92); } }
  .noanim #st.go img { animation: none; }
</style>
</head><body>
<div id="stage"><div id="st"><i class="beam" style="left:18%"></i><i class="beam" style="left:31%;opacity:.18"></i><i class="beam" style="left:72%"></i><i class="beam" style="left:86%;opacity:.18"></i></div></div>
<script>
const L = HVL.get('logo', 'org');
const src = /^https?:|\//.test(L) ? L : `../logos/${/\.(png|jpe?g|webp|svg)$/i.test(L) ? L : L + '.png'}`;
document.documentElement.style.setProperty('--h', (+HVL.get('size', 46) || 46) + 'vh');
const st = HVL.$('#st'), im = new Image(); im.src = src; im.alt = ''; im.onerror = () => im.remove(); st.appendChild(im); st.classList.add('go');
</script>
</body></html>

<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVIBET DREAM TEAM</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/teams-el.js"></script>
<script src="../js/awards.js"></script>
<style>
  /* NOVIBET DREAM TEAM – full screen 1920×1080 on the court (site/img/court.png).
     Data: site/data/dreamteam.txt · photos: site/photos/<Όνομα>.png
     ?full=0 transparent · ?loop=20 replay every 20 s · ?refresh=30 · ?noanim=1 · ?logo=league | 0 */
  #dt { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: var(--font, Averta, 'Saira', sans-serif); --aqua: #99f5fd; --ink: #242c3b; --slate: #242c3b; --cut: 14px; }
  #dt.full { background: radial-gradient(1000px 800px at 40% 50%, rgba(153,245,253,.10), transparent 65%), #0c1323 url('../img/bg-novi.jpg') center / cover no-repeat; }
  .par { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  #dt .court { position: absolute; left: -194px; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

  /* player cards */
  #dt .pc { position: absolute; width: 236px; height: 286px; display: flex; flex-direction: column; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  #dt .dph { position: relative; height: 190px; overflow: hidden; --cut: 18px;
    background: radial-gradient(160px 120px at 50% 30%, rgba(153,245,253,.35), transparent 70%), linear-gradient(170deg, #3b4a63 0%, #242c3b 55%, #1a2a38 100%); box-shadow: inset 0 -4px 0 var(--aqua); }
  #dt .dph > img { position: absolute; left: 0; right: 0; bottom: 4px; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
  #dt .dph > img.np { left: 50%; width: 120px; height: 120px; bottom: auto; top: 34px; margin-left: -60px; object-fit: contain; opacity: .9; }
  #dt .rl { position: absolute; left: 0; top: 0; height: 30px; padding: 0 18px 0 22px; display: grid; place-items: center; background: var(--aqua); color: var(--ink); font-weight: 900; font-size: 15px; letter-spacing: 1px; --cut: 10px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  #dt .pc.L .rl { background: #fff; }
  #dt .tl { position: absolute; right: 10px; bottom: 10px; width: 52px; height: 52px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  #dt .tl .logo { width: 100%; height: 100%; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: var(--aqua); } #dt .tl img { width: 100%; height: 100%; object-fit: contain; }
  #dt .nm { height: 64px; margin-top: 4px; padding: 6px 22px 0 20px; background: linear-gradient(100deg, #ffffff 0%, #d4f9fc 60%, var(--aqua) 100%); color: var(--ink); }
  #dt .nm small { display: block; font-weight: 700; font-size: 16px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #dt .nm b { display: block; font-weight: 900; font-style: italic; font-size: 30px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #dt .tn { height: 26px; margin-top: 2px; padding: 0 18px; display: flex; align-items: center; background: rgba(36,44,59,.95); font-weight: 800; font-size: 15px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; --cut: 10px; }

  /* title column */
  #dt .dhd { position: absolute; left: 1290px; width: 540px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; filter: drop-shadow(12px 9px 0 rgba(153,245,253,.22)); }
  #dt .dhd .lg { height: 230px; width: auto; max-width: 440px; object-fit: contain; margin-bottom: 18px; filter: drop-shadow(0 6px 22px rgba(153,245,253,.35)); }
  #dt .dhd .k { height: 50px; padding: 0 46px; display: grid; place-items: center; background: var(--slate); color: var(--aqua); font-weight: 900; font-size: 28px; letter-spacing: 8px; box-shadow: inset 0 -4px 0 var(--aqua); }
  #dt .dhd .tt { padding: 6px 54px 10px; display: grid; place-items: center; background: linear-gradient(100deg, #ffffff 0%, #d4f9fc 60%, var(--aqua) 100%); color: var(--ink); font-weight: 900; font-style: italic; font-size: 84px; line-height: 1; text-transform: uppercase; white-space: nowrap; max-width: 540px; overflow: hidden; --cut: 28px; }
  #dt .dhd .gd { height: 56px; padding: 0 44px; display: grid; place-items: center; background: linear-gradient(100deg, var(--aqua), #c6f6fa); color: var(--ink); font-weight: 900; font-size: 28px; letter-spacing: 2px; white-space: nowrap; }
  #dt .err { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 34px; font-weight: 800; color: #ff8a95; }

  /* entrance */
  #dt.go .court { animation: court .9s cubic-bezier(.16, 1, .3, 1) .1s both; }
  #dt.go .dhd > * { animation: tin .6s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(.35s + var(--d) * .12s); }
  #dt.go .pc { animation: pop .55s cubic-bezier(.34, 1.4, .64, 1) both; animation-delay: calc(1s + var(--d) * .14s); }
  #dt.go .pc .dph > img:not(.np) { animation: rise .8s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(1.15s + var(--d) * .14s); }
  @keyframes court { from { opacity: 0; transform: scale(.94); } }
  @keyframes tin { from { opacity: 0; transform: translateX(70px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(40px) scale(.85); } }
  @keyframes rise { from { transform: translateY(60px); opacity: 0; } }
  .noanim #dt * { animation: none !important; }
</style>
</head><body>
<div id="stage"><div id="dt"></div></div>
<script>
const DT = HVL.$('#dt');
if (HVL.get('full', '1') !== '0') DT.classList.add('full');
const LG = HVL.get('logo', 'league');
// Slots on the court (card centre). Net on the right: front row next to it, then the middle column, libero at the back.
const SLOT = { F1: [990, 240], F2: [990, 545], F3: [990, 850], M1: [680, 240], M2: [680, 545], M3: [680, 850], B2: [380, 545], B1: [380, 240], B3: [380, 850] };
const PREF = { OH: ['F1', 'M1'], MB: ['F2', 'M3'], OP: ['F3'], S: ['M2'], L: ['B2'] };
const ORDER = ['F1', 'F2', 'F3', 'M1', 'M2', 'M3', 'B2', 'B1', 'B3'];
function place(players) {
  const used = new Set(), out = [];
  for (const p of players) { const s = (PREF[p.role] || []).find((k) => !used.has(k)); if (s) { used.add(s); out.push([p, s]); } else out.push([p, null]); }
  for (const o of out) if (!o[1]) { const s = ORDER.find((k) => !used.has(k)); if (s) { used.add(s); o[1] = s; } }
  return out.filter((o) => o[1]);
}
AW.run('dreamteam.txt', (txt, err) => {
  if (err) { DT.innerHTML = `<div class="err">⚠ Δεν φορτώθηκε το data/dreamteam.txt (${HVL.esc(err.message)})</div>`; return; }
  const d = AW.parseDream(txt);
  const cards = place(d.players).map(([p, s], i) => {
    const [x, y] = SLOT[s], n = AW.split(p.name);
    return `<div class="pc ${p.role}" style="left:${x - 118}px;top:${y - 143}px;--d:${i}">
      <div class="dph par">${AW.photo(p.name, p.photo)}<span class="rl">${AW.roleLabel(p.role)}</span>${p.team ? `<div class="tl">${AW.team(p.team)}</div>` : ''}</div>
      <div class="nm par">${n.first ? `<small>${HVL.esc(n.first)}</small>` : ''}<b class="fit">${HVL.esc(n.last)}</b></div>
      ${p.team ? `<div class="tn par"><span class="fit" style="display:block;width:100%;overflow:hidden">${HVL.esc(p.team)}</span></div>` : ''}
    </div>`;
  });
  const hd = [
    LG !== '0' ? `<img class="lg" src="../logos/${/\.(png|jpe?g|webp|svg)$/i.test(LG) ? LG : LG + '.png'}" onerror="this.remove()">` : '',
    `<div class="k par">${HVL.esc(d.subtitle || 'NOVIBET')}</div>`,
    `<div class="tt par fit">${HVL.esc(d.title || 'DREAM TEAM')}</div>`,
    d.gameday ? `<div class="gd par">${HVL.esc(AW.gameday(d.gameday))}</div>` : '',
  ].filter(Boolean).map((h, i) => h.replace(/^<(\w+) /, `<$1 style="--d:${i}" `));
  DT.innerHTML = `<img class="court" src="../img/court.png" alt=""><div class="dhd">${hd.join('')}</div>${cards.join('')}`;
  HVL.fit(DT);
  DT.classList.remove('go'); void DT.offsetWidth; DT.classList.add('go');
});
</script>
</body></html>

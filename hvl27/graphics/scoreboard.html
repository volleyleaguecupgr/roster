<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/vendor/jquery.min.js"></script>
<script src="../js/vendor/jquery.signalR.min.js"></script>
<style>
  /* ?pos=tl|tr|bl|br (default tl = top left)  ?scale=0.8 (size)  ?names=short|code|long  ?partials=1 */
  #sb { position: absolute; left: 40px; top: 36px; display: flex; flex-direction: column; gap: 8px; transform: scale(var(--k, .95)); transform-origin: 0 0; }
  #sb.tr { left: auto; right: 40px; transform-origin: 100% 0; } #sb.bl { top: auto; bottom: 40px; transform-origin: 0 100%; } #sb.br { left: auto; right: 40px; top: auto; bottom: 40px; transform-origin: 100% 100%; }
  .head { display: flex; gap: 8px; align-items: center; height: 38px; }
  .head .tag { height: 38px; padding: 0 20px; background: linear-gradient(90deg, var(--red-500), var(--red-700)); font-weight: 800; font-size: 20px; text-transform: uppercase; }
  .head .comp { height: 38px; padding: 0 20px 0 18px; background: var(--g-comp); font-weight: 700; font-size: 18px; text-transform: uppercase; white-space: nowrap; }
  .team { height: 66px; display: grid; grid-template-columns: 66px 430px 50px auto 76px 96px; align-items: center; border-radius: 999px;
          background: var(--g-row-dark); box-shadow: inset 0 0 0 var(--line) #fff; }
  .team .logo { width: 66px; height: 66px; }
  .team .logo.fallback { font-size: 18px; }
  .team .nm { padding-left: 16px; font-weight: 800; font-size: 32px; text-transform: uppercase; }
  /* serve: the ball from the league logo (site/logos/ball.png); yellow dot if the file is missing */
  /* ball: 44px inside the 66px row, centred in its 50px column */
  .serve { width: 44px; height: 44px; justify-self: center; align-self: center; opacity: 0; transform: scale(.4) rotate(-90deg); transition: opacity .3s, transform .45s cubic-bezier(.34, 1.56, .64, 1);
           background: url(../logos/ball.png) center / contain no-repeat; filter: drop-shadow(0 0 6px rgba(153,245,253,.9)); }
  .serve.on { opacity: 1; transform: none; }
  .serve.dot { width: 16px; height: 16px; border-radius: 50%; background: #ffd400; box-shadow: 0 0 10px #ffd400; filter: none; }
  .parts { display: flex; gap: 4px; padding-right: 8px; }
  .parts span { width: 44px; text-align: center; font-weight: 600; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .parts span.w { color: #fff; font-weight: 800; }
  .sets { height: 66px; width: 76px; display: grid; place-items: center; font-weight: 800; font-size: 36px; background: var(--g-win); box-shadow: inset 0 0 0 var(--line) #fff; border-radius: 999px; }
  .pts { height: 66px; width: 96px; display: grid; place-items: center; font-weight: 900; font-size: 42px; border-radius: 999px;
         background: #fff; color: var(--navy-900); font-variant-numeric: tabular-nums; }
  .pts.lead { background: linear-gradient(90deg, #fff, #dfe3ff); }
  .flash { animation: flash .6s ease; }
  /* event tag next to a team row: SET POINT / MATCH POINT / TIME OUT / CHALLENGE (set from control.html) */
  #sb { overflow: visible; }
  .flag { position: absolute; height: 50px; padding: 0 26px; display: grid; place-items: center; white-space: nowrap;
          font-weight: 900; font-style: italic; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; color: #242c3b; background: #99f5fd;
          clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); opacity: 0; translate: -16px 0; transition: opacity .25s, translate .35s cubic-bezier(.16,1,.3,1); pointer-events: none; }
  .flag.on { opacity: 1; translate: 0 0; }
  /* keep the tags out of the card entrance animation (it would show the empty box of the other team) */
  #stage #sb > .flag { animation: none !important; transform: none !important; }
  #stage #sb > .flag:not(.on) { opacity: 0 !important; visibility: hidden; }
  #stage #sb > .flag.on { opacity: 1 !important; visibility: visible; }
  .flag.white { background: #fff; }
</style>
</head><body>
<div id="stage"><div id="sb"></div></div>
<script>
const SB = HVL.$('#sb');
const pos = HVL.get('pos', 'tl'); if (pos !== 'tl') SB.classList.add(pos);
SB.style.setProperty('--k', +HVL.get('scale', .95) || .95);   // ?scale=… overrides (old default .8)
const NAMES = HVL.get('names', 'long');
const showParts = HVL.get('partials', '0') === '1';
let prev = {};
let BALL = true; { const t = new Image(); t.onerror = () => { BALL = false; SB.querySelectorAll('.serve').forEach((e) => e.classList.add('dot')); }; t.src = '../logos/ball.png'; }
/* ---- instant points: the scoreboard listens to Data Project's live service itself (the same push the LiveScore page gets).
   The worker poll stays as the base and the fallback. ?push=0 turns it off. ---- */
const PUSH_ON = HVL.get('push') !== '0' && !HVL.demo;
let BASE = null, P = null, pushMid = null;
const n0 = (v) => (v == null || v === '' ? 0 : +v || 0);
function pbpPick(list) {
  // order-independent: the newest row has the highest RallyID; the serve comes from the row flagged LastAction
  // (that is what the LiveScore page uses), else from the newest rally. ST true/1/"True" = home serves.
  const rows = list.filter((r) => r && typeof r === 'object');
  const id = (r) => (r.RallyID == null ? -1 : +r.RallyID);
  const newest = rows.reduce((a, r) => (!a || id(r) >= id(a) ? r : a), null) || {};
  const rallies = rows.filter((r) => r.RallyT === 0 || r.RallyT === 1);
  const src = rows.find((r) => r.LastAction) || rallies.reduce((a, r) => (!a || id(r) >= id(a) ? r : a), null);
  const st = src ? src.ST : undefined;
  const serve = st == null || st === '' ? null : (st === true || st === 1 || /^(true|1)$/i.test(String(st))) ? 'home' : 'away';
  const t = String(newest.Team || ''), side = t.includes('*') ? 'home' : t.includes('a') ? 'away' : null;
  const event = newest.RallyT === 3 && side ? { type: 'timeout', side, id: newest.RallyID ?? null }
    : newest.RallyT === 4 ? { type: 'challenge', side, id: newest.RallyID ?? null } : null;
  return { serve, event };
}
function pbpRead(list) {
  if (!Array.isArray(list) || !list.length || list[0] == null) return {};
  const r = pbpPick(list); return { serve: r.serve || undefined, event: r.event };
}
// Two feeds from Data Project:
//   ES = the e-scoresheet at the scorer's table (dataprojectservicesignalr) → points / sets, arrives first (LiveScore.aspx list page)
//   DV = DataVolley statistician (dataprojectservicesignalradv) → serve, time-outs, video checks (+ points if ES is not there)
const SR_ES = 'https://dataprojectservicesignalr.azurewebsites.net/signalr', SR_DV = 'https://dataprojectservicesignalradv.azurewebsites.net/signalr';
const dbg = (...a) => { if (HVL.get('debug') === '1') console.log(...a); };
function initP(mid, sc, src) {
  const wh = n0(sc.WonSetHome), wa = n0(sc.WonSetGuest), done = Math.min(5, wh + wa), sets = [];
  for (let i = 1; i <= done; i++) sets.push({ h: n0(sc['Set' + i + 'Home']), a: n0(sc['Set' + i + 'Guest']) });
  const n = Math.min(5, done + 1), keep = P && P.mid === mid ? P : {};
  P = { serve: null, event: null, ...keep, mid, status: sc.Status, setsH: wh, setsA: wa, sets, set: done + 1,
        h: n0(sc['Set' + n + 'Home']), a: n0(sc['Set' + n + 'Guest']), es: keep.es || src === 'es', t: Date.now() };
  if (sc.GoldenSetPlayed) { P.golden = true; P.h = n0(sc.GoldenSetHome); P.a = n0(sc.GoldenSetGuest); }
}
function onScore(o) {                       // sets won {H,G,S}
  const done = n0(o.H) + n0(o.G);
  if (o.S === 1 && done + 1 > P.set) { P.sets[P.set - 1] = P.sets[P.set - 1] || { h: P.h, a: P.a }; P.set = done + 1; P.h = 0; P.a = 0; P.event = null; }
  P.setsH = n0(o.H); P.setsA = n0(o.G); P.status = o.S;
}
function onSet(o) {                         // one set {SN,HP,GP,(S),(GS)}
  if (o.GS || o.SN > 5) { P.h = n0(o.HP); P.a = n0(o.GP); P.golden = true; return; }
  if (o.SN < P.set || o.S === 2) { P.sets[o.SN - 1] = { h: n0(o.HP), a: n0(o.GP) }; if (o.SN === P.set && o.S === 2) { P.h = n0(o.HP); P.a = n0(o.GP); } return; }
  if (o.SN > P.set) P.set = o.SN;
  P.h = n0(o.HP); P.a = n0(o.GP);
  if (P.status === 0 && (P.h || P.a)) P.status = 1;
}
function connect(url, mid, setup, onReady) {
  const c = jQuery.hubConnection(url, { useDefaultPath: false });
  const hub = c.createHubProxy('signalRLiveHubFederations');
  setup(hub);
  c.disconnected(() => { dbg('push: lost', url); if (url === SR_ES && P) P.es = false; if (pushMid === mid) setTimeout(() => c.start().done(() => onReady(hub, c)), 3000); });
  c.start().done(() => onReady(hub, c)).fail((e) => console.warn('push: cannot connect to', url, e));
}
function startPush(mid) {
  if (!PUSH_ON || !mid || pushMid === mid || !window.jQuery || !jQuery.hubConnection) return;
  pushMid = mid; P = null;
  const upd = () => { if (P) { P.t = Date.now(); if (BASE) draw(merged(BASE), false); } };
  const mine = (o) => o && String(o.MID ?? o.ChampionshipMatchID) === String(mid);
  // ES: the points
  connect(SR_ES, mid, (hub) => {
    hub.on('updateMatchScoreData_ES', (o) => { if (P && mine(o)) { onScore(o); upd(); } });
    hub.on('updateMatchSetData_ES', (o) => { if (P && mine(o)) { onSet(o); upd(); } });
    hub.on('updateMatchAllSetData_ES', (list) => { if (P && Array.isArray(list)) { list.filter(mine).forEach(onSet); upd(); } });
  }, (hub, c) => {
    hub.invoke('getLiveScoreListData_From_ES', String(mid), 'hvl').done((arr) => {
      const sc = Array.isArray(arr) ? arr.find(mine) || arr[0] : arr;
      if (!sc) return dbg('push ES: no data for', mid);
      initP(mid, sc, 'es'); dbg('push ES connected', c.transport && c.transport.name, P); upd();
    }).fail((e) => console.warn('push ES: list call failed', e));
  });
  // DV: serve / time-outs / video check (points only while ES is not there)
  const pbp = (list) => { if (!P) return; const r = pbpRead(list); if (r.serve) P.serve = r.serve; P.event = r.event || null; upd(); };
  connect(SR_DV, mid, (hub) => {
    hub.on('updateMatchScoreData_DV', (o) => { if (P && !P.es) { onScore(o); upd(); } });
    hub.on('updateMatchSetData_DV', (o) => { if (P && !P.es) { onSet(o); upd(); } });
    hub.on('updatePlayByPlayData', pbp); hub.on('refreshPlayByPlayData', pbp);
    hub.on('updatePlayByPlayLastRallyData', () => {}); hub.on('showTimeoutSubstitutionOnCourt', () => {});
  }, (hub, c) => {
    hub.invoke('getLiveScoreData_From_DV', String(mid), 'hvl').done((sc) => {
      if (!sc) return;
      if (!P || !P.es) initP(mid, sc, 'dv');
      dbg('push DV connected', c.transport && c.transport.name);
      if (sc.Status === 1) hub.invoke('getPlayByPlayData', String(mid), (+sc.WonSetHome || 0) + (+sc.WonSetGuest || 0) + 1, 'hvl', !!sc.GoldenSetPlayed).done(pbp);
      upd();
    }).fail((e) => console.warn('push DV: score call failed', e));
  });
}
// live service values on top of the worker data (never over the operator's manual / backup score)
function merged(d) {
  if (!P || !d.match || P.mid !== d.match.mid || d.state?.score?.manual || d.state?.backup?.active || P.status === 2 && d.match.status === 'finished') return d;
  const x = JSON.parse(JSON.stringify(d)), m = x.match;
  if (P.status === 1) m.status = 'live'; else if (P.status === 2) m.status = 'finished';
  m.setsHome = P.setsH; m.setsAway = P.setsA;
  m.sets = [...P.sets, ...(P.status === 2 ? [] : [{ h: P.h, a: P.a }])];
  m.current = P.status === 2 ? null : { ...(m.current || {}), set: P.set, h: P.h, a: P.a, serve: P.serve || m.current?.serve || null, event: P.event, ready: P.status === 0 };
  return x;
}
HVL.poll('match', 3, (d, first) => { BASE = d; draw(merged(d), first); startPush(d.match && d.match.mid); });
function draw(d, first) {
  if (!d.match) { SB.innerHTML = ''; return HVL.msg(d.message); }
  const m = d.match, s = HVL.scoreState(d);
  const label = m.status === 'finished' ? HVL.t('final') : m.status === 'upcoming' && !m.current ? (HVL.dateLong(m.iso).time || '') : `${HVL.t('set')} ${s.set}`;
  const nm = (t) => NAMES === 'code' ? t.code : NAMES === 'long' ? t.name : HVL.teamName(t);
  const finishedSets = (s.sets || []).filter((x, i) => Math.max(x.h, x.a) >= (i === 4 ? 15 : 25) && Math.abs(x.h - x.a) >= 2);
  const parts = (side) => showParts ? `<div class="parts">${finishedSets.map((x) => `<span class="${(side === 'h' ? x.h > x.a : x.a > x.h) ? 'w' : ''}">${x[side]}</span>`).join('')}</div>` : '<div></div>';
  const live = m.status === 'live' || s.manual || !!m.current;   // m.current also when the live page is open before the first point (0–0)
  const row = (t, side) => `
    <div class="team">
      ${HVL.logo(t)}<div class="nm fit">${HVL.esc(nm(t))}</div>
      <div class="serve ${BALL ? '' : 'dot'} ${s.serve === side ? 'on' : ''}"></div>
      ${parts(side === 'home' ? 'h' : 'a')}
      <div class="sets" data-k="${side}s">${side === 'home' ? s.setsH : s.setsA}</div>
      <div class="pts ${live && (side === 'home' ? s.h > s.a : s.a > s.h) ? 'lead' : ''}" data-k="${side}p">${live ? (side === 'home' ? s.h : s.a) : ''}</div>
    </div>`;
  SB.innerHTML = `
    <div class="head"><div class="pill tag">${live && !s.manual ? '<span class="live-dot" style="margin-right:10px"></span>' : ''}${HVL.esc(label)}</div><div class="pill comp">${HVL.esc(d.league.name)}</div></div>
    ${row(d.home, 'home')}${row(d.away, 'away')}<div class="flag" data-side="home"></div><div class="flag" data-side="away"></div>`;
  // grid width: hide parts column when unused
  SB.querySelectorAll('.team').forEach((el) => { if (!showParts) el.style.gridTemplateColumns = '66px 430px 50px 0 76px 96px'; });
  // flash changed numbers
  const now = { hs: s.setsH, as: s.setsA, hp: s.h, ap: s.a };
  if (!first) for (const k in now) if (prev[k] !== now[k]) SB.querySelector(`[data-k="${k[0] === 'h' ? 'home' : 'away'}${k[1]}"]`)?.classList.add('flash');
  prev = now;
  LAST = d; flags();
  HVL.animate(SB, first);
}
// event tags: set point / match point stay until switched off; time out and challenge hide by themselves
let LAST = null;
const FLAG = { setpoint: ['Set point', ''], matchpoint: ['Match point', ''], timeout: ['Time out', 'white', +HVL.get('tto', 30)], challenge: ['Challenge', 'white', +HVL.get('chl', 60)] };
// automatic tags from the live feed (time out / video check of a team), unless the operator set one for that side. ?auto=0 turns them off
const SEEN = {};
function autoFlag(side) {
  if (HVL.get('auto') === '0' || !LAST) return null;
  const e = LAST.match?.current?.event;
  if (!e || e.side !== side || HVL.scoreState(LAST).manual) return null;
  const k = e.type + ':' + e.id; if (!SEEN[k]) SEEN[k] = Date.now();
  return { type: e.type, t: SEEN[k] };
}
function flags() {
  const f = LAST?.state?.flags || {};
  const rows = SB.querySelectorAll('.team');
  SB.querySelectorAll('.flag').forEach((el) => {
    const r = rows[el.dataset.side === 'home' ? 0 : 1];
    if (r) { el.style.left = (r.offsetLeft + r.offsetWidth + 10) + 'px'; el.style.top = (r.offsetTop + (r.offsetHeight - 50) / 2) + 'px'; }
    const x = f[el.dataset.side] || autoFlag(el.dataset.side), def = x && FLAG[x.type];
    const on = !!def && (!def[2] || !x.t || Date.now() - x.t < def[2] * 1000);
    if (on) { el.textContent = def[0]; el.className = 'flag on ' + def[1]; } else el.classList.remove('on');
  });
}
setInterval(flags, 500);
</script>
</body></html>

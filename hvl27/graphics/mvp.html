<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ΒΙΚΟΣ COLA MVP</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/teams-el.js"></script>
<script src="../js/awards.js"></script>
<style>
  /* ΒΙΚΟΣ COLA MVP – full screen 1920×1080. Data: site/data/mvp.txt · photo: site/photos/<Παίκτης>.png · badge: site/logos/mvp.png
     ?full=0 transparent (over video) · ?loop=15 replay every 15 s · ?refresh=30 · ?noanim=1 · ?logo=league | 0 (top-right) */
  #mv { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: var(--font, Averta, 'Saira', sans-serif); --aqua: #99f5fd; --ink: #242c3b; --slate: #242c3b; --cut: 18px; perspective: 1600px; }
  #mv.full { background: radial-gradient(900px 700px at 22% 45%, rgba(153,245,253,.16), transparent 65%), radial-gradient(1200px 800px at 85% 10%, rgba(153,245,253,.10), transparent 60%), #0c1323 url('../img/bg-novi.jpg') center / cover no-repeat; }
  .par { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }

  /* the badge: enters in the middle (3D flip, flash, light sweep), then settles on the left */
  #mv .badge { position: absolute; left: 90px; top: 130px; width: 660px; height: 660px; transform-style: preserve-3d; filter: drop-shadow(0 0 36px rgba(153,245,253,.55)) drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  #mv .badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #mv .badge .shine { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    -webkit-mask: url('../logos/mvp.png') center / contain no-repeat; mask: url('../logos/mvp.png') center / contain no-repeat;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 0 0 / 300% 100% no-repeat; }
  #mv .mflash { position: absolute; left: 960px; top: 540px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(153,245,253,.45) 22%, rgba(153,245,253,0) 60%); }

  /* player + slanted panels behind */
  #mv .slab { position: absolute; top: 150px; bottom: 0; transform: skewX(-12deg); transform-origin: bottom; }
  #mv .slab.s1 { left: 760px; width: 400px; background: linear-gradient(180deg, rgba(153,245,253,.95) 0%, rgba(153,245,253,.55) 55%, rgba(153,245,253,.08) 100%); }
  #mv .slab.s2 { left: 1180px; width: 46px; background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,.25) 100%); top: 250px; }
  #mv .slab.s3 { left: 690px; width: 22px; background: linear-gradient(180deg, rgba(153,245,253,.7), rgba(153,245,253,0)); top: 330px; }
  #mv .ply { position: absolute; left: 560px; width: 760px; top: 70px; bottom: 0; display: flex; align-items: flex-end; justify-content: center; }
  #mv .ply img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: bottom; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
  #mv .ply img.np { width: 420px; height: auto; margin-bottom: 300px; filter: drop-shadow(0 0 30px rgba(153,245,253,.5)); }
  #mv .ply img:not(.np) { -webkit-mask: linear-gradient(180deg, #000 82%, transparent 100%); mask: linear-gradient(180deg, #000 82%, transparent 100%); }

  /* text */
  #mv .mtxt { position: absolute; left: 1150px; right: 70px; bottom: 120px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; filter: drop-shadow(12px 9px 0 rgba(153,245,253,.22)); }
  #mv .gd { height: 54px; padding: 0 44px; display: grid; place-items: center; background: var(--slate); color: var(--aqua); font-weight: 900; font-size: 28px; letter-spacing: 2px; white-space: nowrap; box-shadow: inset 0 -4px 0 var(--aqua); }
  #mv .nm { width: 100%; padding: 14px 60px 16px 46px; background: linear-gradient(100deg, #ffffff 0%, #d4f9fc 60%, var(--aqua) 100%); color: var(--ink); --cut: 28px; }
  #mv .nm small { display: block; font-weight: 700; font-size: 34px; line-height: 1.05; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  #mv .nm b { display: block; font-weight: 900; font-style: italic; font-size: 92px; line-height: .98; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #mv .tm { height: 74px; padding: 0 44px 0 26px; display: flex; align-items: center; gap: 16px; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(30,52,66,.95)); max-width: 100%; }
  #mv .tm .logo { width: 56px; height: 56px; flex: none; display: grid; place-items: center; font-weight: 900; color: var(--aqua); } #mv .tm .logo img { width: 100%; height: 100%; object-fit: contain; }
  #mv .tm span { font-weight: 800; font-size: 32px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #mv .st { display: flex; gap: 12px; flex-wrap: wrap; }
  #mv .st .c { height: 70px; padding: 0 30px; display: flex; align-items: baseline; gap: 10px; background: rgba(36,44,59,.92); box-shadow: inset 0 -3px 0 var(--aqua); --cut: 14px; }
  #mv .st .c b { font-weight: 900; font-size: 44px; line-height: 70px; color: var(--aqua); font-variant-numeric: tabular-nums; }
  #mv .st .c span { font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
  #mv .lg { position: absolute; right: 60px; top: 44px; height: 120px; width: auto; filter: drop-shadow(0 6px 22px rgba(153,245,253,.35)); }
  #mv .err { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 34px; font-weight: 800; color: #ff8a95; }

  /* ---------- entrance ---------- */
  #mv.go .badge { animation: bdg 3.2s cubic-bezier(.34, 1.2, .64, 1) both; }
  #mv.go .badge .shine { animation: shine 1.1s ease-in-out 1.35s both, shine 1.1s ease-in-out 7s infinite; }
  #mv.go .mflash { animation: flash 1s ease-out .75s both; }
  #mv.go .slab { animation: slab .7s cubic-bezier(.16, 1, .3, 1) both; } #mv.go .s1 { animation-delay: 2.55s; } #mv.go .s2 { animation-delay: 2.7s; } #mv.go .s3 { animation-delay: 2.8s; }
  #mv.go .ply { animation: ply 1s cubic-bezier(.16, 1, .3, 1) 2.75s both; }
  #mv.go .mtxt > * { animation: tin .6s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(3.15s + var(--d) * .14s); }
  #mv.go .lg { animation: fade .8s ease 3.3s both; }
  #mv.go.idle .badge { animation: float 6s ease-in-out infinite; }
  @keyframes bdg {
    0% { opacity: 0; transform: translate(540px, 80px) scale(.1) rotateY(-360deg); }
    30% { opacity: 1; transform: translate(540px, 80px) scale(1.42) rotateY(0); }
    42%, 72% { transform: translate(540px, 80px) scale(1.3) rotateY(0); }
    100% { opacity: 1; transform: translate(0, 0) scale(1) rotateY(0); }
  }
  @keyframes shine { 0% { opacity: 1; background-position: 100% 0; } 100% { opacity: 1; background-position: 0 0; } }
  @keyframes flash { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15); } }
  @keyframes slab { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes ply { from { opacity: 0; transform: translateY(90px) scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes tin { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .noanim #mv * { animation: none !important; }
</style>
</head><body>
<div id="stage"><div id="mv"></div></div>
<script>
const MV = HVL.$('#mv');
if (HVL.get('full', '1') !== '0') MV.classList.add('full');
const LG = HVL.get('logo', 'league');
let idleT = 0;
AW.run('mvp.txt', (txt, err) => {
  if (err) { MV.innerHTML = `<div class="err">⚠ Δεν φορτώθηκε το data/mvp.txt (${HVL.esc(err.message)})</div>`; return; }
  const d = AW.parseMVP(txt), n = AW.split(d.player);
  const parts = [
    d.gameday ? `<div class="gd par">${HVL.esc(AW.gameday(d.gameday))}</div>` : '',
    `<div class="nm par">${n.first ? `<small>${HVL.esc(n.first)}</small>` : ''}<b class="fit">${HVL.esc(n.last || '—')}</b></div>`,
    d.team ? `<div class="tm par">${AW.team(d.team)}<span class="fit">${HVL.esc(d.team)}</span></div>` : '',
    d.stats.length ? `<div class="st">${d.stats.map((s) => `<div class="c par">${s.n ? `<b>${HVL.esc(s.n)}</b>` : ''}<span>${HVL.esc(s.l)}</span></div>`).join('')}</div>` : '',
  ].filter(Boolean);
  MV.innerHTML = `
    <div class="mflash"></div>
    <div class="slab s1"></div><div class="slab s3"></div><div class="slab s2"></div>
    <div class="ply">${AW.photo(d.player, d.photo)}</div>
    <div class="badge"><img src="../logos/mvp.png" alt=""><i class="shine"></i></div>
    ${LG !== '0' ? `<img class="lg" src="../logos/${/\.(png|jpe?g|webp|svg)$/i.test(LG) ? LG : LG + '.png'}" onerror="this.remove()">` : ''}
    <div class="mtxt">${parts.map((p, i) => p.replace('class="', `style="--d:${i}" class="`)).join('')}</div>`;
  HVL.fit(MV);
  MV.classList.remove('go', 'idle'); void MV.offsetWidth; MV.classList.add('go');
  clearTimeout(idleT); idleT = setTimeout(() => MV.classList.add('idle'), 4200);
});
</script>
</body></html>

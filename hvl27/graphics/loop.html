<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphics loop</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; background: transparent; opacity: 0; transition: opacity var(--fade, .6s) ease; pointer-events: none; }
  iframe.on { opacity: 1; }
  body.bg { background: #333 linear-gradient(135deg, #2a3446, #50607a); }
</style>
</head><body>
<iframe id="a" allowtransparency="true"></iframe><iframe id="b" allowtransparency="true"></iframe>
<script>
const P = new URLSearchParams(location.search);
const ITEMS = {
  org: ['static', 'logo=org'], champ: ['static', 'logo=champ'], intro: ['next-match', ''], announcement: ['next-match', ''],
  schedule: ['schedule', ''], results: ['results', ''], standings: ['standings', ''], leaders: ['leaders', ''],
  h2h: ['h2h', ''], history: ['h2h', ''], teamscomparison: ['team-compare', ''], roster: ['roster', ''], rosteropp: ['roster', 'opp=1'],
  coaches: ['coaches', ''], referees: ['referees', ''], speaker: ['speaker', ''],
  pregame: ['sidebox', 'type=pre'], postgame: ['sidebox', 'type=post'], result: ['result', ''], stats: ['stats', ''], topplayers: ['top-players', ''],
  videocheck: ['videocheck', ''], startingsix: ['starting-six', ''],
};
const SETS = {
  all: 'org,champ,intro,schedule,results,standings,h2h,roster,rosteropp,referees,speaker',
  fixed: 'org,champ,schedule,results,standings,leaders',
  game: 'intro,teamscomparison,h2h,roster,rosteropp,referees,speaker',
};
const list = (P.get('items') || SETS[P.get('set') || 'all'] || SETS.all).split(',').map((x) => x.trim()).filter(Boolean)
  .map((x) => { const [k, d] = x.split(':'); return ITEMS[k.toLowerCase()] ? { k: k.toLowerCase(), d: +d || 0 } : null; }).filter(Boolean);
const DUR = (+P.get('dur') || 10) * 1000, FADE = +P.get('fade') || 0.6;
document.documentElement.style.setProperty('--fade', FADE + 's');
if (P.get('bg') === '1') document.body.classList.add('bg');
// parameters passed on to every graphic
const pass = new URLSearchParams(P); for (const k of ['items', 'set', 'dur', 'fade', 'once', 'bg']) pass.delete(k);
const url = (it) => { const [page, fixed] = ITEMS[it.k]; const q = new URLSearchParams(fixed); for (const [k, v] of pass) if (!q.has(k)) q.set(k, v); return `${page}.html?${q}`; };
// scale to the window (OBS source 1920×1080 = 1)
const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); document.querySelectorAll('iframe').forEach((f) => { f.style.transform = `scale(${k})`; f.style.transformOrigin = '0 0'; }); };
addEventListener('resize', fit); fit();
const slots = [document.getElementById('a'), document.getElementById('b')];
let i = 0, cur = 1, token = 0;
function show() {
  if (!list.length) return;
  const my = ++token, it = list[i % list.length], next = slots[1 - cur], prev = slots[cur];
  next.onload = () => {
    if (my !== token) return;
    next.onload = null;
    setTimeout(() => {
      next.classList.add('on'); prev.classList.remove('on');
      setTimeout(() => { if (!prev.classList.contains('on')) { prev.onload = null; prev.src = 'about:blank'; } }, FADE * 1000 + 50);
    }, 150);
  };
  next.src = url(it);
  cur = 1 - cur; i++;
  if (P.get('once') === '1' && i >= list.length) return;
  setTimeout(show, it.d ? it.d * 1000 : DUR);
}
show();
</script>
</body></html>

<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre game / Post game side box</title>
<link rel="stylesheet" href="../css/cev.css">
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<style>
  /* Right-side box over the camera picture.
     ?type=pre  (default) → PRE GAME: teams, date, time, venue
     ?type=post           → POST GAME: final score in sets + every set score
     ?title=…  own title · ?w=500 box width (380–900) · ?noanim=1 */
  :root { --w: 500px; --k: .70; --aqua: #99f5fd; --ink: #242c3b; --slate: #242c3b; --slate2: #2f394b; }
  #side { position: absolute; top: 0; right: 0; bottom: 0; width: var(--w); overflow: hidden; color: #fff;
          font-family: var(--font, Averta, 'Saira', sans-serif); }
  #side .x-bg { position: absolute; inset: 0; background: #0c1323 url('../img/bg-novi.jpg') center / cover no-repeat;
              clip-path: polygon(60px 0, 100% 0, 100% 100%, 0 100%); }
  #side .x-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,19,35,.55), rgba(12,19,35,.15) 40%, rgba(12,19,35,.65)); }
  #side .x-edge { position: absolute; top: -20px; bottom: -20px; left: 30px; width: 4px; background: linear-gradient(180deg, transparent, var(--aqua) 18%, #fff 50%, var(--aqua) 82%, transparent);
                transform: skewX(-3.17deg); transform-origin: 0 100%; box-shadow: 0 0 18px 3px rgba(153,245,253,.55); }
  #side .x-in { position: absolute; left: 60px; top: 0; width: 630px; height: calc(1080px / var(--k)); transform: scale(var(--k)); transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 36px 60px; }
  .x-lg { height: 104px; width: auto; object-fit: contain; }
  .x-tt { margin-top: 26px; height: 76px; padding: 0 56px; display: grid; place-items: center; background: linear-gradient(100deg, #99f5fd, #c4fbff); color: var(--ink);
        font-weight: 900; font-style: italic; font-size: 46px; letter-spacing: 1px; text-transform: uppercase; clip-path: polygon(20px 0, 100% 0, calc(100% - 20px) 100%, 0 100%); white-space: nowrap; }
  .x-st { margin-top: 10px; height: 40px; padding: 0 40px; display: grid; place-items: center; background: var(--slate2); border-bottom: 3px solid var(--aqua);
        font-weight: 800; font-size: 17px; letter-spacing: 1.2px; text-transform: uppercase; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .x-teams { margin-top: 48px; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 176px minmax(0, 1fr); align-items: start; }
  .x-tm { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .x-tm .logo { width: 210px; height: 210px; background: #fff; border-radius: 0; box-shadow: none;
              clip-path: polygon(14% 0, 100% 0, 100% 86%, 86% 100%, 0 100%, 0 14%); }
  .x-tm .logo img { width: 84%; height: 84%; object-fit: contain; } .x-tm .logo.fallback { color: var(--ink); font-size: 52px; font-weight: 900; }
  .x-tm .x-nm { width: 100%; height: 96px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px; }
  .x-tm .x-nm span { display: block; width: 100%; font-weight: 900; font-size: 34px; line-height: 1.05; text-transform: uppercase; }
  .x-mid { height: 210px; display: grid; place-items: center; }
  .x-vs { width: 112px; height: 76px; display: grid; place-items: center; background: var(--aqua); color: var(--ink); font-weight: 900; font-style: italic; font-size: 40px;
        clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  .x-fs { display: flex; align-items: center; gap: 6px; }
  .x-fs b { width: 64px; height: 92px; display: grid; place-items: center; background: var(--slate2); font-size: 60px; font-weight: 900; }
  .x-fs b.x-w { background: var(--aqua); color: var(--ink); } .x-fs i { font-style: normal; font-size: 40px; font-weight: 900; opacity: .7; }
  .x-when { margin-top: 36px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .x-when .x-d { height: 70px; padding: 0 46px; display: grid; place-items: center; background: linear-gradient(100deg, rgba(36,44,59,.97), rgba(29,36,49,.97));
             box-shadow: inset 0 -4px 0 var(--aqua); font-weight: 900; font-size: 30px; text-transform: uppercase; white-space: nowrap; clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
  .x-when .x-t { height: 60px; padding: 0 44px; display: grid; place-items: center; background: var(--aqua); color: var(--ink); font-weight: 900; font-size: 36px;
             clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  .x-venue { margin-top: 16px; font-weight: 800; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.88); text-align: center; }
  .x-sets { margin-top: 38px; width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .x-sets .x-r { width: 460px; height: 56px; display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; background: linear-gradient(100deg, rgba(47,57,75,.94), rgba(30,37,51,.94));
             clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .x-sets .x-r span { text-align: center; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; color: rgba(255,255,255,.75); text-transform: uppercase; }
  .x-sets .x-r b { height: 100%; display: grid; place-items: center; font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .x-sets .x-r b.x-w { background: var(--aqua); color: var(--ink); }
  /* entrance */
  #side.go .x-bg, #side.go .x-edge { animation: sbIn .7s cubic-bezier(.16, 1, .3, 1) both; }
  #side.go .x-in > * { animation: sbUp .6s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(.25s + var(--i, 0) * .07s); }
  @keyframes sbIn { from { transform: translateX(105%); } }
  @keyframes sbUp { from { opacity: 0; transform: translateY(26px); } }
  .noanim #side .x-bg, .noanim #side .x-edge, .noanim #side .x-in > * { animation: none !important; }
</style>
</head><body>
<div id="stage"><div id="side"></div></div>
<script>
const POST = HVL.get('type', 'pre') === 'post';
{ const w = Math.max(380, Math.min(900, +HVL.get('w', 500) || 500));   // ?w=… box width in px (content scales with it)
  document.documentElement.style.setProperty('--w', w + 'px'); document.documentElement.style.setProperty('--k', ((w - 60) / 630).toFixed(4)); }
const SIDE = HVL.$('#side');
const LOGO = { hvl: 'league', cup: 'leaguecup', supercup: 'supercup' }[HVL.league] || 'league';
// team names: up to 2 lines, both the same size
function fitNames() {
  const els = [...SIDE.querySelectorAll('.x-nm span')]; if (!els.length) return;
  const sizes = els.map((e) => { e.style.fontSize = ''; let fs = parseFloat(getComputedStyle(e).fontSize); const box = e.parentNode;
    while ((e.scrollWidth > e.clientWidth + 1 || e.offsetHeight > box.clientHeight) && fs > 14) { fs -= 1; e.style.fontSize = fs + 'px'; } return fs; });
  const m = Math.min(...sizes); els.forEach((e) => (e.style.fontSize = m + 'px'));
}
HVL.poll('match', POST ? 15 : 60, (d, first) => {
  if (!d.match) { SIDE.innerHTML = ''; return HVL.msg(d.message); }
  const m = d.match, s = HVL.scoreState(d), h = d.home, a = d.away, dt = HVL.dateLong(m.iso);
  if (m.iso) { const D = new Date(m.iso), f = (o) => new Intl.DateTimeFormat(HVL.lang === 'el' ? 'el-GR' : 'en-GB', { timeZone: 'Europe/Athens', ...o }).format(D);
    dt.date = `${f({ weekday: 'long' })} ${f({ day: 'numeric' })} ${f({ month: 'long' })}`.normalize('NFD').replace(/[\u0300-\u036f]/g, '').normalize('NFC').toUpperCase(); }
  const sets = (s.sets || m.sets || []).filter((x) => x && (x.h || x.a));
  const title = HVL.get('title') || (POST ? (m.status === 'live' ? 'Live' : 'Post game') : 'Pre game');
  const sub = [m.round, d.league?.name].filter(Boolean).join(' · ');
  const hw = s.setsH > s.setsA, aw = s.setsA > s.setsH;
  const mid = POST ? `<div class="x-fs"><b class="${hw ? 'x-w' : ''}">${s.setsH}</b><i>–</i><b class="${aw ? 'x-w' : ''}">${s.setsA}</b></div>` : '<div class="x-vs">VS</div>';
  const items = [
    `<img class="x-lg" src="../logos/${LOGO}.png" onerror="this.style.visibility='hidden'">`,
    `<div class="x-tt">${HVL.esc(title)}</div>`,
    sub ? `<div class="x-st">${HVL.esc(sub)}</div>` : '',
    `<div class="x-teams"><div class="x-tm">${HVL.logo(h)}<div class="x-nm"><span>${HVL.esc(h.name)}</span></div></div><div class="x-mid">${mid}</div>
       <div class="x-tm">${HVL.logo(a)}<div class="x-nm"><span>${HVL.esc(a.name)}</span></div></div></div>`,
    POST
      ? `<div class="x-sets">${sets.map((x, i) => `<div class="x-r"><b class="${x.h > x.a ? 'x-w' : ''}">${x.h}</b><span>${HVL.lang === 'el' ? 'ΣΕΤ' : 'SET'} ${i + 1}</span><b class="${x.a > x.h ? 'x-w' : ''}">${x.a}</b></div>`).join('')}</div>`
      : `<div class="x-when"><div class="x-d">${HVL.esc(dt.date || '')}</div><div class="x-t">${HVL.esc(dt.time || '')}</div></div>${m.venue ? `<div class="x-venue">${HVL.esc(m.venue)}</div>` : ''}`,
  ].filter(Boolean);
  SIDE.innerHTML = `<div class="x-bg"></div><i class="x-edge"></i><div class="x-in">${items.map((x, i) => x.replace(/^<(\w+)/, `<$1 style="--i:${i}"`)).join('')}</div>`;
  fitNames(); if (document.fonts?.ready) document.fonts.ready.then(fitNames);
  if (first) { SIDE.classList.remove('go'); void SIDE.offsetWidth; SIDE.classList.add('go'); }
});
</script>
</body></html>
